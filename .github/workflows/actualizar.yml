name: Actualizar tablero Pumas 7s

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bajar datos de VALD
        env:
          VALD_CLIENT_ID: ${{ secrets.VALD_CLIENT_ID }}
          VALD_CLIENT_SECRET: ${{ secrets.VALD_CLIENT_SECRET }}
          VALD_TENANT_ID: ${{ secrets.VALD_TENANT_ID }}
        run: python bajar.py

      - name: Bajar datos de Catapult
        env:
          CATAPULT_TOKEN: ${{ secrets.CATAPULT_TOKEN }}
        run: python bajar_catapult.py

      - name: Bajar rutina y correctivos (hoja del PF)
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          pip install --quiet google-auth requests
          python bajar_gimnasio.py

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp index.html _site/
          cp data.json _site/
          cp carga.json _site/
          cp -r carga _site/
          cp -r readiness _site/
          cp -r rtp _site/
          cp -r gimnasio _site/
          if [ -f gimnasio.json ]; then cp gimnasio.json _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
