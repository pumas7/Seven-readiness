name: Actualizar gimnasio (hoja del PF)

# Baja de la hoja del PF la rutina, los correctivos, el físico y el objetivo GPS (plan.json),
# y republica el sitio. Los datos de VALD y Catapult se toman tal cual están publicados,
# así no hay que esperar a esas APIs. Corre sola cada hora y también desde el botón.

on:
  workflow_dispatch:
  # Automático: cada hora de 8 a 23 (hora argentina = UTC-3), así una pestaña nueva de la hoja
  # (Sem 18, Sem 19...) aparece sola en el tablero sin tocar ningún botón.
  schedule:
    - cron: '17 11-23 * * *'
    - cron: '17 0-2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Misma cola que "Actualizar tablero": nunca publican los dos a la vez.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  gimnasio:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bajar rutina y correctivos (hoja del PF)
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          pip install --quiet google-auth requests
          python bajar_gimnasio.py

      - name: Bajar objetivo semanal GPS (hoja del PF)
        id: plan
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python bajar_sheets.py

      - name: Traer lo que ya está publicado (VALD, Catapult; objetivo GPS si no se pudo leer)
        run: |
          set -e
          SITE="https://pumas7.github.io/Seven-readiness"
          V=$(date +%s)
          curl -fsSL --retry 3 "$SITE/data.json?v=$V" -o data.json
          curl -fsSL --retry 3 "$SITE/carga.json?v=$V" -o carga.json
          if [ "${{ steps.plan.outcome }}" != "success" ] || [ ! -f plan.json ]; then
            curl -fsSL --retry 3 "$SITE/plan.json?v=$V" -o plan.json || rm -f plan.json
          fi
          python -c "import json; [json.load(open(f)) for f in ('data.json', 'carga.json')]"

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp index.html _site/
          cp data.json _site/
          cp carga.json _site/
          cp -r carga _site/
          cp -r readiness _site/
          cp -r rtp _site/
          cp -r gimnasio _site/
          cp gimnasio.json _site/
          if [ -f plan.json ]; then cp plan.json _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
