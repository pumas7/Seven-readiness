name: Listar parametros Catapult

on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Listar parametros
        env:
          CATAPULT_TOKEN: ${{ secrets.CATAPULT_TOKEN }}
        run: python listar_parametros.py

