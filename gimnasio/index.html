<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gimnasio Pumas 7s</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: pizarra de vestuario a pantalla completa — barra de control arriba (se oculta sola),
   título del día enorme y una grilla de bloques/jugadores que se ve desde el fondo del gimnasio.
   Una sola estética oscura a propósito: es para la tele del gimnasio. */
:root{
  --bg:#04192A;          /* navy profundo, fondo de la tele */
  --panel:#0A2A44;       /* tarjeta de bloque / jugador */
  --panel-2:#0E3557;     /* fila alterna, inputs */
  --line:#1B4468;
  --fg:#F2F6FA;
  --muted:#8FA9C2;
  --gold:#FFCE00;        /* dorado del escudo: etiquetas y dosis */
  --sky:#5AA3E0;
  --ok:#3CCB86; --warn:#F2B33D; --bad:#F06B6B;
  --f-display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --s-hero:calc(clamp(40px,5.2vw,104px) * var(--k));
  --s-ex:calc(clamp(17px,1.55vw,32px) * var(--k));
  --s-dose:calc(clamp(16px,1.4vw,30px) * var(--k));
  --s-lab:calc(clamp(26px,2.6vw,54px) * var(--k));
  --s-name:calc(clamp(22px,2.1vw,44px) * var(--k));
  --k:1;               /* escala que ajusta el texto para que todo entre en la tele */
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- barra de control ---------- */
.ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:10px 16px;background:rgba(4,25,42,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);transition:opacity .35s,transform .35s}
body.idle .ctrl{opacity:0;transform:translateY(-100%);pointer-events:none}
.ctrl .crest{width:46px;height:32px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px 6px;flex:none}
.ctrl .crest img{width:100%;height:100%;object-fit:contain}
.ctrl .brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin-right:auto;white-space:nowrap}
.ctrl .brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.ctrl label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ctrl select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13.5px;max-width:230px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#04192A}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--sky)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#04192A}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.demo{background:#3A2F07;color:var(--gold);font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}

/* ---------- pantalla ---------- */
.screen{padding-inline:clamp(16px,2.2vw,48px);padding-block:clamp(14px,1.8vw,36px) 40px;display:flex;flex-direction:column;gap:clamp(14px,1.6vw,30px)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px}
.head h1{font-family:var(--f-display);font-weight:800;font-size:var(--s-hero);line-height:.88;letter-spacing:.01em;text-transform:uppercase}
.head h1 em{font-style:normal;color:var(--gold)}
.head .sub{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,1.7vw,36px);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.head .clock{margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,3.4vw,72px);font-variant-numeric:tabular-nums;line-height:.9;text-align:right}
.head .clock small{display:block;font-size:.34em;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.previo{display:flex;flex-wrap:wrap;gap:10px}
.previo span{border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:clamp(14px,1.15vw,24px);font-weight:500;color:#CFE0EF}
.previo b{color:var(--gold);font-weight:700;margin-right:6px}
.tag-edit{display:inline-flex;align-items:center;gap:8px;background:#3A2F07;color:var(--gold);border-radius:999px;padding:5px 14px;font-size:clamp(12px,.95vw,18px);font-weight:600}

/* rutina: un bloque por columna */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(12px,1.2vw,24px);align-items:start}
.block{background:var(--panel);border-radius:16px;overflow:hidden;min-width:0}
.block .bh{display:flex;align-items:baseline;gap:12px;padding:clamp(10px,1vw,20px) clamp(14px,1.3vw,26px) 6px}
.block .bh b{font-family:var(--f-display);font-weight:800;font-size:var(--s-lab);color:var(--gold);line-height:1}
.block .bh span{font-size:clamp(12px,.9vw,18px);color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,42%);gap:4px 14px;align-items:baseline;padding:calc(clamp(9px,.9vw,18px) * var(--k)) clamp(14px,1.3vw,26px);border-top:1px solid var(--line)}
.ex .n{font-family:var(--f-display);font-weight:600;font-size:var(--s-ex);line-height:1.1;text-transform:uppercase;letter-spacing:.01em;min-width:0;overflow-wrap:anywhere}
.ex .d{font-family:var(--f-display);font-weight:700;font-size:var(--s-dose);color:var(--gold);font-variant-numeric:tabular-nums;text-align:right;white-space:pre-line}
.ex .l{grid-column:1/-1;font-size:clamp(11px,.8vw,15px);color:var(--muted)}

/* correctivos: una tarjeta por jugador */
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:clamp(12px,1.2vw,24px);align-items:start}
.player{background:var(--panel);border-radius:16px;overflow:hidden;min-width:0}
.player .ph{padding:clamp(10px,1vw,20px) clamp(14px,1.3vw,26px);font-family:var(--f-display);font-weight:800;font-size:var(--s-name);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
.player .row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,40%);gap:4px 12px;align-items:baseline;padding:calc(clamp(8px,.8vw,16px) * var(--k)) clamp(14px,1.3vw,26px);border-top:1px solid var(--line)}
.player .row:first-of-type{border-top:0}
.chip{font-family:var(--f-display);font-weight:800;font-size:calc(clamp(14px,1.15vw,24px) * var(--k));color:#04192A;background:var(--gold);border-radius:6px;padding:1px 8px;line-height:1.3;min-width:2.4em;text-align:center}
.chip.fin{background:var(--sky)}
.chip.none{background:transparent;border:1px solid var(--line);color:var(--muted)}
.player .n{font-family:var(--f-display);font-weight:600;font-size:calc(clamp(16px,1.35vw,28px) * var(--k));text-transform:uppercase;line-height:1.12;min-width:0;overflow-wrap:anywhere}
.player .d{font-family:var(--f-display);font-weight:700;font-size:calc(clamp(15px,1.25vw,26px) * var(--k));color:var(--gold);text-align:right;white-space:pre-line;font-variant-numeric:tabular-nums}
.empty{padding:22px 26px;color:var(--muted);font-size:clamp(14px,1.1vw,22px)}
.pacts{margin-left:auto;display:flex;gap:6px;flex:none}
body.idle .pacts{visibility:hidden}
.pnote{display:flex;gap:10px;align-items:baseline;margin:0;padding:calc(clamp(8px,.8vw,14px) * var(--k)) clamp(14px,1.3vw,26px);background:#2E2606;color:#FFE27A;font-weight:600;font-size:calc(clamp(14px,1.1vw,22px) * var(--k));line-height:1.3;border-bottom:1px solid #4A3D0A}
.pnote b{color:var(--gold);font-family:var(--f-display);font-weight:800;letter-spacing:.04em;flex:none}
/* solo para el staff: se esconde en la tele (barra oculta) y en pantalla completa */
body.idle .staff,:fullscreen .staff{display:none!important}
.spanel{display:flex;flex-direction:column;gap:8px;background:#0B2238;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 16px;font-size:14.5px;line-height:1.4}
.spanel h3{font-family:var(--f-display);font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px}
.spanel h3.w{color:#F2B33D}
.spanel ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.spanel li b{font-family:var(--f-display);font-size:16px;letter-spacing:.03em;margin-right:6px}
.spanel li small{color:var(--muted);margin-left:6px}
.spanel .sbtn{background:transparent;border:0;color:var(--sky);font-weight:700;cursor:pointer;padding:0;font-size:13px}
.nchip{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:none;background:var(--gold);color:#04192A;border-radius:999px;padding:3px 9px;flex:none}
#btnNotas.hay{background:var(--gold);border-color:var(--gold);color:#04192A}
.tag-arr{display:inline-flex;align-items:center;gap:8px;background:#0E3557;color:#BFD6EA;border-radius:999px;padding:5px 14px;font-size:clamp(12px,.95vw,18px);font-weight:600}
.modal{position:fixed;inset:0;z-index:40;background:rgba(2,12,22,.72);display:flex;align-items:flex-start;justify-content:center;padding:clamp(12px,4vh,48px) 16px;overflow-y:auto}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);padding:20px clamp(16px,2vw,26px)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mhead h2{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.nform{display:grid;grid-template-columns:1fr 110px 1fr;gap:10px 12px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.nform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.nform .wide{grid-column:1/-1}
.nform input,.nform textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--fg);resize:vertical}
.nform .btn{justify-self:start}
.nrow{display:grid;grid-template-columns:110px 130px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.nrow.past{opacity:.55}
.nsem{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:17px}
.nsem small,.ntxt small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted)}
.nrow b{font-family:var(--f-display);font-size:17px;text-transform:uppercase}
.ntxt{font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:10px 0}
@media (max-width:640px){.nform{grid-template-columns:1fr 90px}.nrow{grid-template-columns:1fr auto}.nrow .nsem,.nrow b{grid-column:1}}
.pdfbtn{flex:none;font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:none;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:5px 11px;cursor:pointer}
.pdfbtn:hover{background:var(--gold);color:#04192A}
.pdfbtn:disabled{opacity:.6;cursor:wait}
body.idle .pdfbtn{visibility:hidden}

/* edición */
.ed input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:15px;min-width:0}
.ed .ex,.ed .player .row{grid-template-columns:1fr 150px auto}
.ed .player .row{grid-template-columns:62px 1fr 130px auto}
.x{background:transparent;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;cursor:pointer;color:var(--bad);font-size:16px}
.addrow{display:block;width:100%;background:transparent;border:0;border-top:1px dashed var(--line);padding:10px;color:var(--sky);font-weight:600;cursor:pointer;font-size:14px}
.savebar{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:#0B3150;border-top:2px solid var(--gold)}
.savebar p{margin-right:auto;font-size:14px;color:#D6E4F0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);padding:10px 18px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.toast.err{border-color:var(--bad);color:#FFD0D0}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:70ch}
@media (max-width:640px){.ctrl .brand small{display:none}.ed .ex,.ed .player .row{grid-template-columns:1fr auto}.ed .player .row input.lab{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.ctrl{transition:none}}
</style>
</head>

<script>
const DEMO_DATA = null;
const INICIO = new Date(2026,6,20);            // lunes de la Sem 1 (igual que el RTP)
const GH_USER='pumas7', GH_REPO='Seven-readiness', AJ_PATH='gimnasio_ajustes.json';
const AJ_API=`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${AJ_PATH}`;
const DIAS_ES=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let DATA=null, AJ={version:1,ajustes:{}}, SHA=null, DEMO=false;
let PLAN=null, DIA=null, VISTA=(location.hash==='#correctivos')?'cor':'rut', EDIT=null;
const bc=('BroadcastChannel' in window)?new BroadcastChannel('pumas7-gimnasio'):null;

/* ---------- fechas / semana ---------- */
const hoy=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const semanaDe=d=>Math.floor((d-INICIO)/864e5/7)+1;
function planesDe(n){return Object.entries(DATA.planes).filter(([k,p])=>p.semana===n).map(([k])=>k)}
function diaDeHoy(plan){
  const p=DATA.planes[plan];const dn=DIAS_ES[new Date().getDay()].normalize('NFD').replace(/[̀-ͯ]/g,'');
  const k=Object.keys(p.dias_semana||{}).find(k=>p.dias_semana[k]===dn);return k||Object.keys(p.dias)[0];
}

/* ---------- datos efectivos (hoja + ajustes) ---------- */
const ajKey=(plan,dia,vista)=>`${plan}|${dia}|${vista}`;
/* Cómo se arma lo que se ve:
   1) lo que dice la hoja para ese plan y día;
   2) los ajustes que venían de la semana anterior, jugador por jugador (correctivos) y bloque por bloque (rutina),
      SOLO si el PF no cambió ese jugador/bloque al duplicar la pestaña. Si lo cambió, gana la hoja y se avisa;
   3) los ajustes hechos en esta misma semana (con la misma regla: si después el PF cambió eso en la hoja, gana la hoja). */
const nk=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
const firma=u=>u?JSON.stringify((u.items||[]).map(i=>[nk(i.id),nk(i.ej),nk(i.dosis)])):'';
function unidades(lista,vista){
  const m=new Map(),c={};
  (lista||[]).forEach(u=>{let k=vista==='rut'?nk(u.id):nk(u.jugador);if(vista==='rut'){c[k]=(c[k]||0)+1;k+='#'+c[k]}if(!m.has(k))m.set(k,u)});
  return m;
}
const nombreU=(u,vista)=>vista==='rut'?('Bloque '+(u.id||'—')):u.jugador;
function hoja(plan,dia,vista){const d=DATA.planes[plan]?.dias?.[dia];return d?((vista==='rut'?d.bloques:d.correctivos)||[]):[]}
function predecesor(plan){
  const p=DATA.planes[plan];if(!p)return null;
  const prev=Object.keys(DATA.planes).filter(k=>DATA.planes[k].semana<p.semana);if(!prev.length)return null;
  const s=Math.max(...prev.map(k=>DATA.planes[k].semana));const orden=Object.keys(DATA.planes);
  const nd=k=>Object.keys(DATA.planes[k].dias_semana||{}).length,mio=Object.keys(p.dias_semana||{}).length;
  return prev.filter(k=>DATA.planes[k].semana===s)
    .sort((a,b)=>(Math.abs(nd(a)-mio)-Math.abs(nd(b)-mio))||(nd(b)-nd(a))||(orden.indexOf(b)-orden.indexOf(a)))[0];
}
/* aplica sobre la hoja actual los cambios entre base→datos, solo donde la hoja sigue igual a la base */
function aplicar(lista,vista,base,datos,origenDe,avisos){
  const H=unidades(lista,vista),B=unidades(base,vista),D=unidades(datos,vista),out=new Map(H),marc={};
  for(const [k,u] of D){
    const b=B.get(k);if(b&&firma(b)===firma(u))continue;
    if(firma(H.get(k))===firma(b)){out.set(k,u);marc[k]=origenDe(k)}
    else avisos.push({k,nombre:nombreU(u,vista),...origenDe(k)});
  }
  for(const [k,b] of B){
    if(D.has(k))continue;
    if(firma(H.get(k))===firma(b)){out.delete(k);marc[k]={...origenDe(k),borrado:true}}
    else avisos.push({k,nombre:nombreU(b,vista),...origenDe(k)});
  }
  return {lista:[...out.values()],marc};
}
function seccion(plan,dia,vista){
  let lista=hoja(plan,dia,vista),marc={},avisos=[];
  const a=AJ.ajustes[ajKey(plan,dia,vista)];
  if(!a?.sinArrastre){
    const pr=predecesor(plan);
    if(pr&&DATA.planes[pr].dias?.[dia]){
      const e=seccion(pr,dia,vista);
      const r=aplicar(lista,vista,hoja(pr,dia,vista),e.datos,k=>({...(e.marc[k]||{plan:pr}),arrastre:true}),avisos);
      lista=r.lista;Object.assign(marc,r.marc);
    }
  }
  if(a&&!a.sinArrastre){
    const r=aplicar(lista,vista,a.base||hoja(plan,dia,vista),a.datos,()=>({plan,autor:a.autor,fecha:a.fecha}),avisos);
    lista=r.lista;Object.assign(marc,r.marc);
  }
  avisos=avisos.filter(x=>!(x.k in marc));
  return {datos:lista,marc,avisos,aj:Object.keys(marc).length?a||{}:null};
}

/* ---------- render ---------- */
function render(){
  const p=DATA.planes[PLAN];const day=p?.dias?.[DIA];
  const {datos,aj}=EDIT?{datos:EDIT,aj:null}:seccion(PLAN,DIA,VISTA);
  const ds=p.dias_semana?.[DIA];
  const dsTxt=ds?ds.charAt(0).toUpperCase()+ds.slice(1).replace('miercoles','miércoles').replace('sabado','sábado'):'';
  let h=`<div class="head"><div><h1>${VISTA==='rut'?'Gimnasio':'Correctivos'} · <em>Día ${esc(DIA)}</em></h1>
    <div class="sub">${esc(dsTxt)}${dsTxt?' · ':''}${esc(p.etiqueta)}</div></div>
    <div class="clock" id="clock"></div></div>`;
  const S=seccion(PLAN,DIA,VISTA);
  if(!EDIT&&Object.keys(S.marc).length){
    const arr=[...new Set(Object.values(S.marc).filter(m=>m.arrastre).map(m=>m.plan))],prop=Object.values(S.marc).some(m=>!m.arrastre);
    h+=`<div style="display:flex;flex-wrap:wrap;gap:8px">${prop?`<span class="tag-edit">Ajustado en el tablero${aj?.autor?' por '+esc(aj.autor):''}${aj?.fecha?' · '+esc(fFecha(aj.fecha)):''} · difiere de la hoja</span>`:''}${arr.length?`<span class="tag-arr">Con ajustes que vienen de ${arr.map(esc).join(', ')}</span>`:''}</div>`;
  }
  if(!EDIT)h+=panelStaff(S);
  if(VISTA==='rut'){
    if(day?.previo?.length&&!EDIT)h+=`<div class="previo">${day.previo.map((t,i)=>`<span><b>${i+1}</b>${esc(t)}</span>`).join('')}</div>`;
    h+=EDIT?rutEdit(datos):rutView(datos);
  }else{
    h+=EDIT?corEdit(datos):corView(datos);
  }
  $('#screen').innerHTML=h;tick();ajustar();
  $('#otra').href=VISTA==='rut'?'#correctivos':'#rutina';
  $('#otra').textContent=VISTA==='rut'?'Abrir correctivos en otra pantalla ↗':'Abrir rutina en otra pantalla ↗';
  $('#vRut').setAttribute('aria-pressed',VISTA==='rut');$('#vCor').setAttribute('aria-pressed',VISTA==='cor');
  $('#btnReset').hidden=!(EDIT&&Object.keys(S.marc).length);
  const nv=notasVisibles(PLAN).length;$('#btnNotas').textContent=nv?`Notas (${nv})`:'Notas';$('#btnNotas').classList.toggle('hay',!!nv);
  $('#dlRut').hidden=VISTA!=='rut'||!!EDIT;
}
const NOMBRE_BLOQUE={A:'Activación',F:'Fuerza'};
function rutView(bl){
  if(!bl?.length)return `<div class="empty">No hay rutina de gimnasio cargada para este día en la hoja.</div>`;
  return `<div class="blocks">${bl.map(b=>`<section class="block"><div class="bh"><b>${esc(b.id||'—')}</b><span>${esc(NOMBRE_BLOQUE[(b.id||'')[0]]||'Bloque')}</span></div>
    ${b.items.map(it=>`<div class="ex"><div class="n">${esc(it.ej)}</div><div class="d">${esc(it.dosis)}</div></div>`).join('')}</section>`).join('')}</div>`;
}
function corView(ps){
  if(!ps?.length)return `<div class="empty">No hay correctivos cargados para este día.</div>`;
  return `<div class="players">${ps.map(pl=>`<section class="player"><div class="ph"><span>${esc(pl.jugador)}</span>${notasVisibles(PLAN,pl.jugador).length?'<span class="nchip staff" title="Tiene nota para esta semana">NOTA</span>':''}<span class="pacts"><button class="pdfbtn" data-nota="${esc(pl.jugador)}" title="Dejar una nota para una semana siguiente">+ Nota</button><button class="pdfbtn" data-pdf="${esc(pl.jugador)}" title="Bajar sus correctivos de la semana en PDF">PDF ↓</button></span></div>

    ${pl.items.length?pl.items.map(it=>`<div class="row"><span class="chip ${/^FIN/i.test(it.id)?'fin':it.id?'':'none'}">${esc(/^FIN/i.test(it.id)?'FIN':it.id||'·')}</span><div class="n">${esc(it.ej)}</div><div class="d">${esc(it.dosis)}</div></div>`).join('')
      :`<div class="empty">Sin correctivo para este día.</div>`}</section>`).join('')}</div>`;
}
/* edición: inputs con data-path para volcar al estado */
const inp=(path,val,cls='',ph='')=>`<input class="${cls}" data-path="${path}" value="${esc(val)}" placeholder="${ph}" aria-label="${ph}">`;
function rutEdit(bl){
  return `<div class="blocks ed">${bl.map((b,i)=>`<section class="block"><div class="bh" style="gap:8px">${inp(`${i}.id`,b.id,'','Bloque (A1, F1…)')}<button class="x" data-del="b${i}" title="Borrar bloque" aria-label="Borrar bloque">✕</button></div>
    ${b.items.map((it,j)=>`<div class="ex">${inp(`${i}.items.${j}.ej`,it.ej,'','Ejercicio')}${inp(`${i}.items.${j}.dosis`,it.dosis,'','Dosis')}<button class="x" data-del="b${i}.${j}" aria-label="Borrar ejercicio">✕</button></div>`).join('')}
    <button class="addrow" data-add="b${i}">+ Agregar ejercicio</button></section>`).join('')}
    <section class="block"><button class="addrow" style="border:0;padding:22px" data-add="bloque">+ Agregar bloque</button></section></div>`;
}
function corEdit(ps){
  return `<div class="players ed">${ps.map((pl,i)=>`<section class="player"><div class="ph" style="gap:8px">${inp(`${i}.jugador`,pl.jugador,'','Jugador')}<button class="x" data-del="p${i}" aria-label="Borrar jugador">✕</button></div>
    ${pl.items.map((it,j)=>`<div class="row">${inp(`${i}.items.${j}.id`,it.id,'lab','A1')}${inp(`${i}.items.${j}.ej`,it.ej,'','Ejercicio')}${inp(`${i}.items.${j}.dosis`,it.dosis,'','Dosis')}<button class="x" data-del="p${i}.${j}" aria-label="Borrar ejercicio">✕</button></div>`).join('')}
    <button class="addrow" data-add="p${i}">+ Agregar ejercicio</button></section>`).join('')}
    <section class="player"><button class="addrow" style="border:0;padding:22px" data-add="jugador">+ Agregar jugador</button></section></div>`;
}
function setPath(obj,path,val){const k=path.split('.');let o=obj;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}

/* ---------- que entre todo en la pantalla (solo en pantallas grandes, sin editar) ---------- */
function ajustar(){
  const r=document.documentElement;r.style.setProperty('--k',1);
  if(EDIT||innerWidth<900)return;
  let k=1;const alto=()=>$('#screen').getBoundingClientRect().bottom+scrollY;
  while(alto()>innerHeight&&k>0.5){k-=0.04;r.style.setProperty('--k',k.toFixed(2))}
}

const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function leerAjustesApi(token){
  const r=await fetch(AJ_API+'?ref=main&t='+Date.now(),{headers:{Authorization:'token '+token,Accept:'application/vnd.github+json'}});
  if(r.status===404){SHA=null;return {version:1,ajustes:{}}}
  if(!r.ok)throw new Error(r.status);const j=await r.json();SHA=j.sha;return JSON.parse(b64d(j.content));
}
async function persistir(){
  if(DEMO){ls.set('gym_demo_aj',JSON.stringify(AJ));return true}
  let token=ls.get('gh_token');
  if(!token){token=$('#tok')?.value?.trim();if(!token){pedirToken();return false}ls.set('gh_token',token)}
  try{
    const prev=SHA;const remoto=await leerAjustesApi(token);
    // fusiona: lo remoto + lo que cambió acá (por clave), para no pisar a otra pantalla
    AJ={...remoto,ajustes:{...remoto.ajustes,...PEND.set}};PEND.del.forEach(k=>delete AJ.ajustes[k]);
    const body={message:'Gimnasio: ajuste desde la pantalla',content:b64e(JSON.stringify(AJ,null,1)+'\n'),branch:'main'};if(SHA)body.sha=SHA;
    const r=await fetch(AJ_API,{method:'PUT',headers:{Authorization:'token '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===401){try{localStorage.removeItem('gh_token')}catch(e){}toast('El token no sirve. Volvé a guardar para ingresarlo de nuevo.',true);return false}
    if(r.status===409||r.status===422){toast('Otra pantalla guardó al mismo tiempo. Volvé a tocar Guardar.',true);return false}
    if(!r.ok){toast('No se pudo guardar ('+r.status+').',true);return false}
    SHA=(await r.json()).content.sha;return true;
  }catch(e){toast('No se pudo guardar: '+e.message,true);return false}
}

const nnN=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase();
function firmaJugador(plan,jug){
  const p=DATA.planes[plan];if(!p)return '';
  return Object.keys(p.dias).sort((a,b)=>a-b).map(d=>firma(unidades(seccion(plan,d,'cor').datos,'cor').get(nk(jug)))).join('|');
}
/* una nota de la Sem N se ve en la Sem N y sigue en las siguientes mientras el jugador no cambie (hoja + ajustes) */
function notaVisibleEn(n,plan){
  const p=DATA.planes[plan];if(!p||n.semana>p.semana)return false;
  if(n.semana===p.semana)return true;
  let cur=plan;const f0=firmaJugador(plan,n.jugador);if(!f0.replace(/\|/g,''))return false;
  while(DATA.planes[cur].semana>n.semana){
    const pr=predecesor(cur);if(!pr||firmaJugador(pr,n.jugador)!==f0)return false;cur=pr;
  }
  return DATA.planes[cur].semana===n.semana;
}
const notasVisibles=(plan,jug)=>DATA&&DATA.planes[plan]?NOTAS.notas.filter(n=>(!jug||nnN(n.jugador)===nnN(jug))&&notaVisibleEn(n,plan)):[];

/* ---------- PDF de correctivos por jugador (toda la semana del plan elegido) ---------- */
const nn=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase();
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1).replace('miercoles','miércoles').replace('sabado','sábado');
const fDM=d=>d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
const CDN_PDF=['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
let libsPDF=null;
function cargarScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('sin conexión a la librería de PDF'));document.head.appendChild(s)})}
async function libs(){
  if(!libsPDF)libsPDF=(async()=>{for(const u of CDN_PDF)await cargarScript(u)})();
  try{await libsPDF}catch(e){libsPDF=null;throw e}
  return window.jspdf.jsPDF;
}
function crestPNG(){return new Promise(ok=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=950;c.height=546;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/png'))}catch(e){ok(null)}};im.onerror=()=>ok(null);im.src=document.querySelector('.crest img').src})}
async function pdfJugador(nombre){
  const jsPDF=await libs();const p=DATA.planes[PLAN];
  const lunes=new Date(INICIO.getTime()+(p.semana-1)*7*864e5);
  const OFF={lunes:0,martes:1,miercoles:2,jueves:3,viernes:4,sabado:5,domingo:6};
  const doc=new jsPDF({unit:'mm',format:'a4'});const W=210,M=14,NAVY=[0,46,75],GOLD=[255,206,0];
  doc.setFillColor(...NAVY);doc.rect(0,0,W,34,'F');
  const png=await crestPNG();
  if(png){doc.setFillColor(255,255,255);doc.roundedRect(M,7,34,20,3,3,'F');doc.addImage(png,'PNG',M+2.5,8.8,29,16.7)}
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(19);
  doc.text('CORRECTIVOS · '+nombre.toUpperCase(),M+40,17);
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(200,215,230);
  doc.text(`${PLAN}  ·  semana del ${fDM(lunes)} al ${fDM(new Date(lunes.getTime()+6*864e5))}`,M+40,24);
  let y=46,alguno=false;
  for(const dia of Object.keys(p.dias).sort((a,b)=>a-b)){
    const pl=(seccion(PLAN,dia,'cor').datos||[]).find(x=>nn(x.jugador)===nn(nombre));
    const ds=p.dias_semana?.[dia];const fecha=ds&&OFF[ds]!=null?new Date(lunes.getTime()+OFF[ds]*864e5):null;
    if(y>255){doc.addPage();y=20}
    doc.setTextColor(...NAVY);doc.setFont('helvetica','bold');doc.setFontSize(12.5);
    doc.text(`DÍA ${dia}`+(ds?`  ·  ${cap(ds)} ${fDM(fecha)}`:''),M,y);
    doc.setDrawColor(...GOLD);doc.setLineWidth(.8);doc.line(M,y+1.8,W-M,y+1.8);y+=5;
    if(!pl||!pl.items.length){doc.setFont('helvetica','italic');doc.setFontSize(10);doc.setTextColor(120,135,150);doc.text('Sin correctivo este día.',M,y+5);y+=14;continue}
    alguno=true;
    doc.autoTable({startY:y,margin:{left:M,right:M},head:[['','Ejercicio','Dosis']],
      body:pl.items.map(it=>[/^FIN/i.test(it.id)?'FIN':(it.id||''),it.ej,it.dosis||'']),
      theme:'grid',styles:{font:'helvetica',fontSize:10.5,cellPadding:2.6,lineColor:[221,231,240],lineWidth:.2,textColor:[11,26,43],valign:'middle'},
      headStyles:{fillColor:NAVY,textColor:255,fontStyle:'bold',fontSize:9},
      columnStyles:{0:{cellWidth:15,halign:'center',fontStyle:'bold',fillColor:[255,247,209]},1:{fontStyle:'bold'},2:{cellWidth:62}}});
    y=doc.lastAutoTable.finalY+11;
  }
  if(!alguno){toast(`${nombre} no tiene correctivos en ${PLAN}.`,true);return}
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(133,149,166);
    doc.text('Pumas 7s · Preparación física — generado el '+new Date().toLocaleDateString('es-AR'),M,289);doc.text(`${i}/${n}`,W-M,289,{align:'right'})}
  doc.save(`Correctivos_${nn(nombre).replace(/[^A-Z0-9]+/g,'_')}_${PLAN.replace(/[^A-Za-z0-9]+/g,'_')}.pdf`);
}

/* ---------- PDF de la rutina de gimnasio (día o semana) ---------- */

  const fechaDe=d=>{const ds=p.dias_semana?.[d];return ds&&OFF[ds]!=null?`${cap(ds)} ${fDM(new Date(lunes.getTime()+OFF[ds]*864e5))}`:''};
  const dias=modo==='dia'?[DIA]:Object.keys(p.dias).sort((a,b)=>a-b);
  const doc=new jsPDF({unit:'mm',format:'a4'});const W=210,M=14,NAVY=[0,46,75],GOLD=[255,206,0];
  doc.setFillColor(...NAVY);doc.rect(0,0,W,34,'F');
  const png=await crestPNG();
  if(png){doc.setFillColor(255,255,255);doc.roundedRect(M,7,34,20,3,3,'F');doc.addImage(png,'PNG',M+2.5,8.8,29,16.7)}
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(19);

  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(200,215,230);
  const fd=fechaDe(DIA);
  doc.text(modo==='dia'?`${PLAN}${fd?'  ·  '+fd:''}`:`${PLAN}  ·  semana del ${fDM(lunes)} al ${fDM(new Date(lunes.getTime()+6*864e5))}`,M+40,24);
  let y=46,alguno=false;
  for(const dia of dias){
    const bl=seccion(PLAN,dia,'rut').datos||[];const prev=p.dias?.[dia]?.previo||[];
    if(y>235){doc.addPage();y=20}
    if(modo==='semana'){
      const f=fechaDe(dia);
      doc.setTextColor(...NAVY);doc.setFont('helvetica','bold');doc.setFontSize(12.5);
      doc.text(`DÍA ${dia}`+(f?`  ·  ${f}`:''),M,y);
      doc.setDrawColor(...GOLD);doc.setLineWidth(.8);doc.line(M,y+1.8,W-M,y+1.8);y+=5;
    }
    if(prev.length){
      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90,105,120);
      const t=doc.splitTextToSize('Previo: '+prev.map((x,i)=>`${i+1}) ${x}`).join('    '),W-2*M);
      doc.text(t,M,y+4);y+=t.length*4.6+3;
    }
    if(!bl.length){doc.setFont('helvetica','italic');doc.setFontSize(10);doc.setTextColor(120,135,150);doc.text('Sin rutina cargada este día.',M,y+5);y+=14;continue}
    alguno=true;
    const body=[];bl.forEach(b=>b.items.forEach((it,i)=>body.push([i===0?(b.id||''):'',it.ej,it.dosis||''])));
    doc.autoTable({startY:y,margin:{left:M,right:M},head:[['','Ejercicio','Dosis']],body,
      theme:'grid',styles:{font:'helvetica',fontSize:10.5,cellPadding:2.6,lineColor:[221,231,240],lineWidth:.2,textColor:[11,26,43],valign:'middle'},
      headStyles:{fillColor:NAVY,textColor:255,fontStyle:'bold',fontSize:9},
      columnStyles:{0:{cellWidth:15,halign:'center',fontStyle:'bold',fillColor:[255,247,209]},1:{fontStyle:'bold'},2:{cellWidth:62}},
      didParseCell:d=>{if(d.section==='body'&&d.column.index===0&&!d.cell.raw)d.cell.styles.fillColor=[255,255,255]}});
    y=doc.lastAutoTable.finalY+11;
  }
  if(!alguno){toast('No hay rutina cargada para '+(modo==='dia'?'este día.':'esta semana.'),true);return}
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(133,149,166);
    doc.text('Pumas 7s · Preparación física — generado el '+new Date().toLocaleDateString('es-AR'),M,289);doc.text(`${i}/${n}`,W-M,289,{align:'right'})}
  const pl=PLAN.replace(/[^A-Za-z0-9]+/g,'_');
  doc.save(modo==='dia'?`Gimnasio_${pl}_Dia${DIA}.pdf`:`Gimnasio_${pl}_semana.pdf`);
}
$('#dlRut').addEventListener('click',async e=>{
  const b=e.target.closest('[data-rpdf]');if(!b||EDIT||!DATA)return;
  const t=b.textContent;b.disabled=true;b.textContent='Armando…';
  try{await pdfRutina(b.dataset.rpdf)}catch(err){toast('No se pudo armar el PDF: '+err.message,true)}
  finally{b.disabled=false;b.textContent=t}
});
bc&&(bc.onmessage=e=>{const m=e.data;if(m.t==='sel'&&!EDIT){setSel(m.plan,m.dia,true)}
  if(m.t==='aj'){AJ=m.aj;if(!EDIT)render()}
  if(m.t==='notas'){NOTAS=m.notas;if(!EDIT)render()}});
window.addEventListener('storage',e=>{if(e.key==='gym_demo_aj'&&DEMO){try{AJ=JSON.parse(e.newValue)||AJ}catch(x){}if(!EDIT)render()}});
window.addEventListener('hashchange',()=>{if(EDIT)return;VISTA=location.hash==='#correctivos'?'cor':'rut';render()});
// la barra se esconde sola a los 6 s sin mover el mouse (para la tele)
let idleT;function wake(){if(document.body.classList.contains('idle')){document.body.classList.remove('idle');ajustar()}clearTimeout(idleT);idleT=setTimeout(()=>{if(!EDIT){document.body.classList.add('idle');ajustar()}},6000)}
['mousemove','keydown','touchstart','focusin'].forEach(ev=>addEventListener(ev,wake,{passive:true}));wake();
// que la pantalla no se apague
(async()=>{try{await navigator.wakeLock?.request('screen')}catch(e){}})();

/* ---------- arranque ---------- */
async function cargar(){
  try{
    const r=await fetch('../gimnasio.json?v='+Date.now());if(!r.ok)throw 0;DATA=await r.json();
    const t=ls.get('gh_token');
    AJ=t?await leerAjustesApi(t).catch(()=>null):null;
    AJ=AJ||await fetch(`https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/${AJ_PATH}?v=`+Date.now()).then(x=>x.ok?x.json():null).catch(()=>null)||{version:1,ajustes:{}};
    await cargarNotas();
    $('#fuente').textContent='Hoja del PF · actualizada '+fFecha(DATA.generated);
    // otra compu: refresca los ajustes cada 30 s
    setInterval(async()=>{if(EDIT)return;const t=ls.get('gh_token');try{const a=t?await leerAjustesApi(t):null;if(a)AJ=a;await cargarNotas();render()}catch(e){}},30000);
  }catch(e){
    $('#screen').innerHTML='<div class="empty">No pude leer la rutina de la hoja del PF. Tocá <b>Actualizar datos</b> en Carga externa y volvé a abrir esta pantalla.</div>';
    $('#fuente').textContent='Sin datos de la hoja';
    return;
  }
  if(!DATA.planes||!Object.keys(DATA.planes).length){
    $('#screen').innerHTML='<div class="empty">La hoja del PF no tiene todavía ninguna pestaña con rutina de gimnasio.</div>';return;
  }
  const n=semanaDe(hoy());const cand=planesDe(n);const guardado=ls.get('gym_plan');
  PLAN=(guardado&&DATA.planes[guardado]&&DATA.planes[guardado].semana===n)?guardado:(cand.sort((a,b)=>Object.keys(DATA.planes[b].dias_semana||{}).length-Object.keys(DATA.planes[a].dias_semana||{}).length)[0]||Object.keys(DATA.planes)[0]);
  DIA=diaDeHoy(PLAN);fillSelects();render();
  const nv=notasVisibles(PLAN).length;
  if(nv&&!document.fullscreenElement)toast(nv===1?'Hay 1 nota para esta semana: tocá Notas.':`Hay ${nv} notas para esta semana: tocá Notas.`);
}
cargar();
</script>
