<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pumas 7s — Tablero de Readiness</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#002e4b; --steel:#0a4368; --sky:#2C74B3; --ice:#A5D7E8;
  --paper:#F4F7FB; --ink:#0B1A2B; --line:#DDE7F0; --gold:#ffce00;
  --green:#1FA463; --amber:#E8A317; --red:#D64545; --grey:#8595A6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(135deg,var(--navy),var(--steel));color:#fff;padding:26px 0 0}
.head-top{display:flex;align-items:center;gap:16px;padding-bottom:20px}
.crest{width:64px;height:44px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.crest img{width:100%;height:100%;object-fit:contain}
.head-titles h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.head-titles p{font-size:13px;opacity:.7;margin-top:2px}
.head-meta{margin-left:auto;text-align:right;font-size:12px;opacity:.7;line-height:1.5}
.tabs{display:flex;gap:2px}
.tab{background:none;border:none;color:rgba(255,255,255,.6);padding:13px 22px;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;transition:.15s;font-family:inherit}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab.active{color:var(--navy);background:var(--paper)}
.tab .sub{display:block;font-size:10px;font-weight:500;opacity:.7;margin-top:1px}
main{padding:22px 0 60px}
.legend{display:flex;gap:18px;align-items:center;margin-bottom:16px;font-size:12px;color:var(--grey);flex-wrap:wrap}
.legend b{color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}.dot.n{background:var(--grey)}
.bandtoggle{display:flex;gap:8px;align-items:center;margin-bottom:18px;font-size:12px;flex-wrap:wrap}
.bandtoggle .lbl{color:var(--grey);font-weight:600}
.btn-band{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;color:var(--ink);font-weight:600}
.btn-band.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.swatch{display:inline-block;width:20px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.sw-swc{background:rgba(31,164,99,.5)}
.sw-te{background:rgba(124,77,196,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.card:hover{border-color:var(--sky);box-shadow:0 6px 20px rgba(20,66,114,.10);transform:translateY(-2px)}
.card .status-bar{position:absolute;top:0;left:0;width:4px;height:100%}
.sb-g{background:var(--green)}.sb-a{background:var(--amber)}.sb-r{background:var(--red)}.sb-n{background:var(--grey)}
.card h3{font-size:15px;font-weight:700;margin-bottom:3px;padding-left:6px}
.card .date{font-size:11px;color:var(--grey);margin-bottom:12px;padding-left:6px}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-left:6px}
.sp-g{background:#E4F5EC;color:var(--green)}.sp-a{background:#FCF2DD;color:#A9750A}.sp-r{background:#FBE4E4;color:var(--red)}.sp-n{background:#EEF1F4;color:var(--grey)}
.metrics{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.mrow .ml{color:var(--grey)}
.mrow .mv{font-weight:600;font-variant-numeric:tabular-nums}
.mrow .flag{width:8px;height:8px;border-radius:50%;margin-left:6px;display:inline-block}
.detail{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;display:none}
.detail.show{display:block}
.detail-head{background:linear-gradient(135deg,var(--steel),var(--sky));color:#fff;padding:20px 24px;display:flex;align-items:center;gap:14px}
.detail-head .back{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.detail-head h2{font-size:19px;font-weight:700}
.detail-head .sub{font-size:12px;opacity:.75;margin-top:2px}
.detail-body{padding:24px}
.chart-block{margin-bottom:30px}

.chart-block{position:relative}
.stat-box{position:absolute;top:2px;right:0;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:11px;line-height:1.5;box-shadow:0 2px 6px rgba(20,66,114,.06);z-index:2;min-width:120px}
.stat-box .sb-row{display:flex;justify-content:space-between;gap:12px}
.stat-box .sb-lbl{color:var(--grey);font-weight:600}
.stat-box .sb-val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.stat-box .sb-val.swc{color:#1a7a4a}
.stat-box .sb-val.te{color:#5a4a9c}
@media(max-width:640px){.stat-box{position:static;margin-bottom:10px;min-width:0}}
.stat-box.nordic-dual{display:flex;gap:10px;min-width:0;padding:8px}
.ndl-box{padding:4px 8px;min-width:118px}
.ndl-box.ndl-asym{border-left:1px solid var(--line);padding-left:12px}
.ndl-title{font-size:10px;color:var(--grey);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;white-space:nowrap}
@media(max-width:640px){.stat-box.nordic-dual{flex-direction:column}.ndl-box.ndl-asym{border-left:none;border-top:1px solid var(--line);padding-left:8px;padding-top:8px}}

.chart-block h4{font-size:13px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.chart-block .desc{font-size:11px;color:var(--grey);margin-bottom:4px}
.chart-block .explain{font-size:12px;color:#3a4a5c;line-height:1.55;margin-bottom:8px;background:#F7FAFD;border-left:3px solid var(--sky);border-radius:0 8px 8px 0;padding:9px 12px}
.chart-block .explain b{color:var(--navy)}
.chart-block .explain div{margin:1px 0}
.chart-block .verdict{font-size:11px;margin-bottom:12px;font-weight:600}

.chart-legend{display:flex;gap:16px;font-size:11px;color:var(--grey);margin-bottom:8px;flex-wrap:wrap}
.chart-legend span{display:inline-flex;align-items:center}
.chart-legend .ln{display:inline-block;width:18px;height:0;border-top-width:2px;border-top-style:solid;margin-right:5px;vertical-align:middle}
.ln-te{border-top-color:rgba(124,77,196,.7);border-top-style:solid}
.ln-swc{border-top-color:rgba(31,164,99,.8);border-top-style:dashed}
.ln-data{border-top-color:#144272;border-top-width:2.5px}
.ln-red{border-top-color:rgba(214,69,69,.7);border-top-style:dashed}
.chart-wrap{position:relative;height:210px}
.empty{text-align:center;padding:50px 20px;color:var(--grey)}
.empty .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px}

.bands-help{border:1px solid var(--line);border-radius:12px;margin-bottom:22px;background:#fff;overflow:hidden}
.bands-help summary{cursor:pointer;padding:12px 16px;font-size:13px;font-weight:700;color:var(--navy);background:#F2F7FC;list-style:none;user-select:none}
.bands-help summary::-webkit-details-marker{display:none}
.bands-help-body{padding:16px}
.bands-help-body>p{font-size:12.5px;color:#3a4a5c;line-height:1.6;margin-bottom:14px}
.band-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.band-card{border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.5}
.band-card.sw-a{background:rgba(44,116,179,.08);border:1px solid rgba(44,116,179,.25)}
.band-card.sw-b{background:rgba(31,164,99,.08);border:1px solid rgba(31,164,99,.25)}
.band-card .bc-head{font-weight:700;color:var(--navy);margin-bottom:6px;font-size:12.5px}
.band-card p{color:#3a4a5c}
.traffic{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#3a4a5c;background:#FAFBFC;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.traffic b{color:var(--navy)}
.bands-help-body .tip{font-size:12px;color:var(--navy);background:rgba(255,206,0,.16);border-radius:8px;padding:10px 12px;line-height:1.5}
@media(max-width:640px){.band-cards{grid-template-columns:1fr}}

.avg-intro{font-size:13px;color:#3a4a5c;line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.avg-intro b{color:var(--navy)}
.avg-section{margin-bottom:28px}
.avg-section-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:8px}
.avg-section-title .tag{font-size:10px;font-weight:600;color:#fff;background:var(--sky);padding:2px 8px;border-radius:10px}
.avg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.avg-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.avg-card .trend-bar{position:absolute;top:0;left:0;width:100%;height:3px}
.tb-up{background:var(--green)}.tb-down{background:var(--red)}.tb-flat{background:var(--grey)}
.avg-card .ac-label{font-size:12px;color:var(--grey);font-weight:600;margin-bottom:8px}
.avg-card .ac-number{font-size:34px;font-weight:800;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.avg-card .ac-unit{font-size:15px;font-weight:600;color:var(--grey);margin-left:2px}
.avg-card .ac-delta{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:5px}
.ac-delta.up{color:var(--green)}.ac-delta.down{color:var(--red)}.ac-delta.flat{color:var(--grey)}
.avg-card .ac-spark{margin-top:12px;height:52px;position:relative}
.avg-card .ac-bands{font-size:10.5px;color:var(--grey);margin-top:10px;line-height:1.6;border-top:1px solid var(--line);padding-top:9px}
.avg-card .ac-bands .bnum{font-weight:700;color:#3a4a5c;font-variant-numeric:tabular-nums}
.avg-card .ac-bands .sw-swc-txt{color:var(--green)}
.avg-card .ac-bands .sw-te-txt{color:#7c4dc4}
@media(max-width:640px){.avg-grid{grid-template-columns:1fr 1fr}.avg-card .ac-number{font-size:26px}}

.rebound-comp{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:24px;overflow:hidden}
.rebound-comp .rc-head{background:linear-gradient(135deg,#3a2d6b,#5a4a9c);color:#fff;padding:12px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.rebound-comp .rc-body{padding:18px}
.rebound-comp .rc-bars{display:flex;gap:24px;align-items:flex-end;justify-content:center;height:150px;margin-bottom:12px}
.rc-bar-group{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 90px}
.rc-bar{width:60px;border-radius:6px 6px 0 0;position:relative;transition:.3s;display:flex;align-items:flex-start;justify-content:center}
.rc-bar-val{color:#fff;font-size:13px;font-weight:700;padding-top:6px}
.rc-bar-inicial{background:linear-gradient(180deg,#7c8fa8,#5a6b82)}
.rc-bar-rebote{background:linear-gradient(180deg,#2C74B3,#144272)}
.rc-bar-label{font-size:11px;color:var(--grey);font-weight:600;text-align:center}
.rc-verdict{text-align:center;font-size:13px;padding:12px;border-radius:10px;margin-top:6px}
.rc-verdict.good{background:#E4F5EC;color:#1a7a4a}
.rc-verdict.mid{background:#FCF2DD;color:#A9750A}
.rc-verdict.low{background:#FBE4E4;color:#c23434}
.rc-verdict b{font-weight:800}
.rc-explain{font-size:11.5px;color:#3a4a5c;line-height:1.55;margin-top:12px;background:#F7FAFD;border-left:3px solid #5a4a9c;border-radius:0 8px 8px 0;padding:10px 12px}
.rc-explain b{color:var(--navy)}

.update-btn{background:var(--gold);color:var(--navy);border:none;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 2px 8px rgba(255,206,0,.3)}
.update-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,206,0,.4)}
.update-btn:disabled{opacity:.6;cursor:wait;transform:none}
.update-btn .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,46,75,.3);border-top-color:var(--navy);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.update-msg{position:fixed;bottom:24px;right:24px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--sky);border-radius:12px;padding:14px 18px;box-shadow:0 6px 24px rgba(0,46,75,.15);font-size:13px;max-width:340px;z-index:1000;display:none;line-height:1.5}
.update-msg.show{display:block}
.update-msg.ok{border-left-color:var(--green)}
.update-msg.err{border-left-color:var(--red)}
.update-msg b{color:var(--navy)}
.update-msg .um-close{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--grey);font-size:16px;border:none;background:none}
.note{font-size:11px;color:var(--grey);margin-top:8px;line-height:1.5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
@media(max-width:640px){.head-meta{display:none}.tab{padding:12px 14px;font-size:13px}}
</style>
</head>

<script>
let DATA = null; // se carga desde data.json

// ===== Boton actualizar datos (dispara GitHub Actions) =====
const GH_USER = "pumas7";
const GH_REPO = "Seven-readiness";
const GH_WORKFLOW = "actualizar.yml";
// El token NO se guarda en el codigo. Se pide una vez y queda guardado en este navegador.
function getToken(){
  let t = localStorage.getItem('gh_token');
  if(!t){
    t = prompt('Pega tu token de GitHub (se guarda solo en este navegador, no en la web):');
    if(t){ localStorage.setItem('gh_token', t.trim()); t = t.trim(); }
  }
  return t;
}
function borrarToken(){
  localStorage.removeItem('gh_token');
  showMsg('<b>Token borrado de este navegador.</b><br>La pr&oacute;xima vez que actualices te lo va a volver a pedir.', 'ok');
}

function showMsg(text, tipo){
  const m = document.getElementById('updateMsg');
  const t = document.getElementById('updateMsgText');
  m.className = 'update-msg show' + (tipo? ' '+tipo : '');
  t.innerHTML = text;
}

async function dispararActualizacion(){
  const btn = document.getElementById('updateBtn');
  const icon = document.getElementById('btnIcon');
  const GH_TOKEN = getToken();
  if(!GH_TOKEN){
    showMsg('<b>No se ingres&oacute; ning&uacute;n token.</b><br>Volv&eacute; a tocar el bot&oacute;n y peg&aacute; tu token de GitHub.', 'err');
    return;
  }
  btn.disabled = true;
  icon.innerHTML = '<span class="spin"></span>';
  showMsg('<b>Actualizando datos...</b><br>Esto tarda alrededor de 1 minuto. La p&aacute;gina se va a recargar sola cuando termine.');
  try{
    const resp = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/actions/workflows/${GH_WORKFLOW}/dispatches`, {
      method: 'POST',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + GH_TOKEN,
        'X-GitHub-Api-Version': '2022-11-28'
      },
      body: JSON.stringify({ ref: 'main' })
    });
    if(resp.status === 204){
      showMsg('<b>&iexcl;Actualizaci&oacute;n iniciada!</b><br>Esper&aacute; ~1 minuto y la p&aacute;gina se recargar&aacute; sola con los datos frescos.', 'ok');
      // recargo en 75 segundos para dar tiempo a que termine el workflow
      setTimeout(()=>{ location.reload(true); }, 75000);
    } else {
      const err = await resp.text();
      if(resp.status === 401){ localStorage.removeItem('gh_token'); }
      showMsg('<b>Hubo un problema.</b><br>C&oacute;digo ' + resp.status + '. Verific&aacute; el token o los permisos.' + (resp.status===401 ? '<br>El token guardado no sirve, se borr&oacute;: volv&eacute; a tocar el bot&oacute;n para cargar uno nuevo.' : '') + '<br><small>' + err.slice(0,150) + '</small>', 'err');
      btn.disabled = false; icon.innerHTML = '&#128260;';
    }
  } catch(e){
    showMsg('<b>Error de conexi&oacute;n.</b><br>' + e.message, 'err');
    btn.disabled = false; icon.innerHTML = '&#128260;';
  }
}

function getSeries(player,tab){
  const raw=DATA.players[player][tab]||[];
  const bw=getBodyWeight(player);
  return raw.map(t=>{const o={date:t.date};for(const k in t)o[k]=t[k];
    if(tab==='nordic'){o.torqueNormL=bw>0?t.leftTorque/bw:null;o.torqueNormR=bw>0?t.rightTorque/bw:null;}
    return o;});
}
function getBodyWeight(player){const c=DATA.players[player].cmj||[];for(let i=c.length-1;i>=0;i--)if(c[i].BODY_WEIGHT)return c[i].BODY_WEIGHT;return 0;}

function stats(series,metric){
  const vals=series.map(s=>s[metric.k]).filter(v=>v!==null&&v!==undefined);
  if(vals.length<2)return null;
  const current=vals[vals.length-1];
  // PROMEDIO DE LOS ULTIMOS 3 REGISTROS PREVIOS (ventana movil).
  // A medida que entran datos nuevos, "current" es el mas reciente y el promedio se recalcula solo.
  const base=vals.slice(Math.max(0,vals.length-4),vals.length-1); // hasta 3 previos
  if(base.length<1)return null;
  const mean=base.reduce((a,b)=>a+b,0)/base.length;
  // desviacion (con signo) en la direccion "mala" de la metrica.
  // Positivo = se movio para el lado malo; negativo = se movio para el lado bueno.
  let diffAbs;
  if(metric.dir==='down')diffAbs=mean-current;              // malo si baja
  else if(metric.dir==='up')diffAbs=current-mean;           // malo si sube
  else if(metric.dir==='absup')diffAbs=Math.abs(current)-Math.abs(mean); // malo si sube en magnitud
  else diffAbs=Math.abs(mean)-Math.abs(current);            // absdown: malo si baja en magnitud
  // % de cambio respecto al promedio de las ultimas 3 (en la direccion mala).
  const denom=Math.abs(mean);
  const pct = denom>0 ? (diffAbs/denom)*100 : 0;
  return {current,mean,diff:diffAbs,pct,vals};
}

// Semaforo por % de desviacion vs promedio de las ultimas 3 evaluaciones.
// Bandas (unicas para todo VALD): 0-10 verde | 11-20 amarillo | 21+ rojo.
// Solo cuenta el movimiento hacia el lado MALO de la metrica; si mejora, siempre verde.
function bandaPorPct(pct){
  if(pct<=10) return 'g';
  if(pct<=20) return 'a';
  return 'r';
}

function statusOf(series,metric){
  if(metric.noStatus){ return {status:'i'}; }
  if(metric.k==='asym'){
    // Asimetria: se semaforiza por el VALOR ABSOLUTO de la evaluacion del dia (no por cambio).
    const vals=series.map(s=>s[metric.k]).filter(v=>v!==null&&v!==undefined);
    if(!vals.length)return {status:'n'};
    const a=Math.abs(vals[vals.length-1]);
    const status=bandaPorPct(a); // 0-10 verde, 11-20 amarillo, 21+ rojo
    return {status, st:{current:vals[vals.length-1], pct:a}};
  }
  const st=stats(series,metric);
  if(!st)return {status:'n'};
  // si el movimiento es hacia el lado bueno (pct<=0), verde directo
  const status = st.pct<=0 ? 'g' : bandaPorPct(st.pct);
  return {status, st};
}

function playerStatus(player,tab){
  const series=getSeries(player,tab);
  if(!series.length)return {status:'n',last:null,metrics:[]};
  const last=series[series.length-1];
  const rank={g:0,a:1,r:2,n:-1,i:-1};let worst='n',res=[];
  for(const m of METRICS[tab]){const s=statusOf(series,m);res.push({m,st:s,val:last[m.k]});if((rank[s.status]??-1)>rank[worst])worst=s.status;}
  return {status:worst,last,metrics:res,series};
}
function statusLabel(s){return {g:'OK',a:'Vigilar',r:'Alerta',n:'Sin dato',i:'Info'}[s];}
// formatea un valor aplicando escala opcional (ej. s->ms x1000), decimales y unidad
function fmtV(v,m){ if(v===null||v===undefined||typeof v!=='number')return v; const sc=m.scale||1; return (v*sc).toFixed(m.dec); }
function fmtU(v,m){ return fmtV(v,m)+(m.unit||''); }
// Mejor registro historico SEGUN LA DIRECCION de la metrica (no el maximo numerico).
// down  = malo si baja  -> mejor es el MAXIMO   (RSI, altura)
// up    = malo si sube  -> mejor es el MINIMO   (tiempo de contraccion, tiempo de contacto)
// absup = malo si sube en magnitud -> mejor es el de MENOR magnitud (asimetria)
// absdown = malo si baja en magnitud -> mejor es el de MAYOR magnitud (vel. pico excentrica)
function mejorRegistro(vals,dir){
  if(!vals.length)return null;
  if(dir==='up')return Math.min(...vals);
  if(dir==='absup')return vals.reduce((a,b)=>Math.abs(b)<Math.abs(a)?b:a);
  if(dir==='absdown')return vals.reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a);
  return Math.max(...vals);
}
function cvar(v){return {g:'green',a:'amber',r:'red',n:'grey',i:'grey'}[v];}
// Formatea fecha ISO (AAAA-MM-DD) a DD-MM-AAAA para mostrar en todo el tablero
function fmtDate(iso){
  if(!iso||typeof iso!=='string')return iso;
  const p=iso.split('-'); if(p.length!==3)return iso;
  return `${p[2]}-${p[1]}-${p[0]}`;
}
// Version corta para ejes de grafico: DD-MM
function fmtDateShort(iso){
  if(!iso||typeof iso!=='string')return iso;
  const p=iso.split('-'); if(p.length!==3)return iso;
  return `${p[2]}-${p[1]}`;
}

// Construye el promedio del equipo por fecha para una metrica
function teamAvgSeries(tab, mkey){
  // junto todas las mediciones de todos los jugadores por fecha
  const byDate = {};
  for(const player in DATA.players){
    const series = getSeries(player, tab);
    for(const s of series){
      const v = s[mkey];
      if(v===null||v===undefined) continue;
      if(!byDate[s.date]) byDate[s.date]=[];
      byDate[s.date].push(v);
    }
  }
  const dates = Object.keys(byDate).sort();
  return dates.map(dt=>({
    date: dt,
    avg: byDate[dt].reduce((a,b)=>a+b,0)/byDate[dt].length,
    n: byDate[dt].length
  }));
}

function renderPromedios(){
  document.getElementById('teamView').style.display='none';
  document.getElementById('detailView').classList.remove('show');
  const host = document.getElementById('promediosView');
  host.style.display='block';
  charts.forEach(c=>c.destroy()); charts=[];

  let html = `<div class="avg-intro"><b>Vista general del equipo.</b> Cada tarjeta muestra el <b>promedio de todo el grupo</b> en su ultima evaluacion (el numero grande), y como viene variando en el tiempo (la mini-linea). Debajo, las dos bandas de referencia del promedio: <span style="color:#7c4dc4;font-weight:700">&plusmn;1 desvio</span> (variacion normal del grupo) y <span style="color:var(--green);font-weight:700">SWC</span> (cambio minimo que importa). Sirve para ver de un vistazo si el equipo entero viene estable, subiendo o cayendo.</div>`;

  for(const tab of ['cmj','cmrj','nordic']){
    const cfg = AVG_METRICS[tab];
    html += `<div class="avg-section"><div class="avg-section-title">${cfg.title}<span class="tag">${cfg.tag}</span></div><div class="avg-grid" id="avgrid_${tab}"></div></div>`;
  }
  host.innerHTML = html;

  // Ahora lleno cada grid y dibujo sparklines
  for(const tab of ['cmj','cmrj','nordic']){
    const cfg = AVG_METRICS[tab];
    const grid = document.getElementById('avgrid_'+tab);
    for(const m of cfg.metrics){
      const serie = teamAvgSeries(tab, m.k);
      const card = document.createElement('div');
      card.className='avg-card';
      if(serie.length===0){
        card.innerHTML=`<div class="ac-label">${m.label}</div><div class="ac-number" style="font-size:18px;color:var(--grey)">Sin datos</div>`;
        grid.appendChild(card); continue;
      }
      const vals = serie.map(s=>s.avg);
      const current = vals[vals.length-1];
      // delta vs promedio previo
      const prevVals = vals.slice(0,-1);
      const prevMean = prevVals.length? prevVals.reduce((a,b)=>a+b,0)/prevVals.length : current;
      const sd = prevVals.length>1 ? Math.sqrt(prevVals.reduce((a,b)=>a+(b-prevMean)**2,0)/(prevVals.length-1)) : 0;
      const swc = 0.2*sd;
      const delta = current - prevMean;
      // direccion de tendencia visual
      let trendCls='flat', arrow='&rarr;';
      const absd = Math.abs(delta);
      if(absd < swc || sd===0){ trendCls='flat'; arrow='&rarr;'; }
      else if(delta>0){ trendCls = m.dir==='down'?'down':'up'; arrow='&uarr;'; }
      else { trendCls = m.dir==='down'?'up':'down'; arrow='&darr;'; }
      const deltaTxt = sd===0 ? 'primer dato' : `${delta>=0?'+':''}${(delta*(m.scale||1)).toFixed(m.dec)} vs promedio`;

      const cid = 'spark_'+tab+'_'+m.k;
      card.innerHTML = `
        <div class="trend-bar tb-${trendCls}"></div>
        <div class="ac-label">${m.label}</div>
        <div><span class="ac-number">${fmtV(current,m)}</span><span class="ac-unit">${m.unit}</span></div>
        <div class="ac-delta ${trendCls}">${arrow} ${deltaTxt}</div>
        <div class="ac-spark"><canvas id="${cid}"></canvas></div>
        <div class="ac-bands">Promedio grupo: <span class="bnum">${fmtU(prevMean,m)}</span><br>
          <span class="sw-te-txt">&plusmn;1 desvio:</span> <span class="bnum">${((prevMean-sd)*(m.scale||1)).toFixed(m.dec)} a ${((prevMean+sd)*(m.scale||1)).toFixed(m.dec)}</span><br>
          <span class="sw-swc-txt">SWC:</span> <span class="bnum">&plusmn;${(swc*(m.scale||1)).toFixed(m.dec)}</span></div>`;
      grid.appendChild(card);
      // sparkline (protegido: si falla no corta el resto)
      try{ drawSpark(cid, serie, m, prevMean, sd, swc); }catch(e){ console.warn('spark fail', m.k, e); }
    }
  }
}

function drawSpark(cid, serie, m, mean, sd, swc){
  const ctx = document.getElementById(cid); if(!ctx) return;
  const vals = serie.map(s=>s.avg);
  const labels = serie.map(s=>fmtDateShort(s.date));
  const dmin=Math.min(...vals, mean-sd), dmax=Math.max(...vals, mean+sd);
  const pad=(dmax-dmin)*0.15||1;
  const ds=[
    {data:vals,borderColor:'#144272',borderWidth:2,tension:.3,pointRadius:vals.map((v,i)=>i===vals.length-1?4:0),pointBackgroundColor:'#144272',fill:false,order:0}
  ];
  if(sd>0 && m.k!=='asym'){
    ds.push({data:vals.map(()=>mean+sd),borderColor:'rgba(124,77,196,.35)',borderWidth:1,pointRadius:0,fill:'+1',order:3});
    ds.push({data:vals.map(()=>mean-sd),borderColor:'rgba(124,77,196,.35)',borderWidth:1,pointRadius:0,backgroundColor:'rgba(124,77,196,.08)',fill:false,order:4});
  }
  const c=new Chart(ctx,{type:'line',data:{labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{enabled:true,callbacks:{title:(t)=>t[0].label,label:(c)=>c.datasetIndex===0?`Prom: ${fmtU(c.parsed.y,m)}`:null,filter:(t)=>t.datasetIndex===0}}},
      scales:{x:{display:false},y:{display:false,min:dmin-pad,max:dmax+pad}}}});
  charts.push(c);
}

function fmtBand(v, dec){
  if(v===0) return '0';
  // si con los decimales dados quedaria 0.00, agrego decimales hasta mostrar algo
  let d = dec;
  while(d<4 && parseFloat(v.toFixed(d))===0) d++;
  return v.toFixed(d);
}

function reboundComparisonHTML(series){
  let last=null;
  for(let i=series.length-1;i>=0;i--){
    if(series[i]['CMRJ_TAKEOFF_JUMP_HEIGHT']!=null && series[i]['CMRJ_REBOUND_JUMP_HEIGHT']!=null){ last=series[i]; break; }
  }
  if(!last) return '';
  const inicial=last['CMRJ_TAKEOFF_JUMP_HEIGHT'], rebote=last['CMRJ_REBOUND_JUMP_HEIGHT'];
  const maxH=Math.max(inicial,rebote);
  const hInicial=Math.round(inicial/maxH*120), hRebote=Math.round(rebote/maxH*120);
  return `
    <div class="rebound-comp">
      <div class="rc-head">&#9889; Altura: Salto inicial vs. Rebote (${fmtDate(last.date)})</div>
      <div class="rc-body">
        <div class="rc-bars">
          <div class="rc-bar-group">
            <div class="rc-bar rc-bar-inicial" style="height:${hInicial}px"><span class="rc-bar-val">${inicial.toFixed(1)}</span></div>
            <div class="rc-bar-label">Salto inicial<br>(tipo CMJ)</div>
          </div>
          <div class="rc-bar-group">
            <div class="rc-bar rc-bar-rebote" style="height:${hRebote}px"><span class="rc-bar-val">${rebote.toFixed(1)}</span></div>

        </div>

    </div>`;
}

        <div class="ndl-box ndl-asym">
          <div class="ndl-title">Asimetria I/D</div>
          <div class="sb-row"><span class="sb-lbl">Actual</span><span class="sb-val" style="color:var(--${cvar(asymStatus.status)})">${asymCurrent!=null?Math.abs(asymCurrent).toFixed(1)+'%':'-'}</span></div>
          <div class="sb-row"><span class="sb-lbl">Bandas</span><span class="sb-val" style="font-size:10px">0-10 / 11-20 / 21+</span></div>
        </div>
      </div>
      <h4><span class="flag" style="width:9px;height:9px;border-radius:50%;background:var(--${cvar(asymStatus.status)})"></span>Torque n&oacute;rdico Izquierda / Derecha &middot; principal</h4>
      <div class="explain"><div><b>Qu&eacute; mide:</b> Fuerza exc&eacute;ntrica de cada pierna en el n&oacute;rdico, ajustada al peso corporal (para comparar entre jugadores).</div><div><b>Qu&eacute; buscamos:</b> Ca&iacute;das sostenidas en cualquiera de las dos piernas, o asimetr&iacute;a creciente entre ambas.</div></div>
      <div class="verdict">${asymVerdict||verdictTorque}</div>
      <div class="chart-legend">
        <span><span class="ln" style="border-top-color:#144272;border-top-width:2.5px"></span>Torque Izquierda</span>
        <span><span class="ln" style="border-top-color:#c0392b;border-top-width:2.5px"></span>Torque Derecha</span>
      </div>
      <div class="chart-wrap"><canvas id="ch_nordic_torque"></canvas></div>
    </div>`;
}

function drawNordicChart(cid,series){
  const ctx=document.getElementById(cid);if(!ctx)return;
  const ptsL=series.map(s=>({x:s.date,y:s.torqueNormL})).filter(p=>p.y!=null);
  const ptsR=series.map(s=>({x:s.date,y:s.torqueNormR})).filter(p=>p.y!=null);
  // eje X comun: todas las fechas que tengan al menos un valor
  const dateSet=[...new Set(series.map(s=>s.date))].sort();
  const labels=dateSet.map(d=>fmtDateShort(d));
  const byDate={}; series.forEach(s=>byDate[s.date]=s);
  const vL=dateSet.map(d=>byDate[d].torqueNormL??null);
  const vR=dateSet.map(d=>byDate[d].torqueNormR??null);

  function lastIdx(vals){for(let i=vals.length-1;i>=0;i--)if(vals[i]!=null)return i;return -1;}

  const allVals=vL.concat(vR).filter(v=>v!=null);
  const dmin=Math.min(...allVals),dmax=Math.max(...allVals);
  const range=dmax-dmin||1, pad=range*0.18;
  const yMin=dmin-pad, yMax=dmax+pad;

  const ds=[
    {label:'Torque Izq',data:vL,borderColor:'#144272',backgroundColor:'#144272',borderWidth:2,tension:.3,order:0,spanGaps:true,
     pointRadius:vL.map((v,i)=>i===lastIdx(vL)?5:2.5),
     pointBackgroundColor:vL.map((v,i)=>i===lastIdx(vL)?'#144272':'rgba(20,66,114,.5)'),
     pointBorderColor:'#fff',pointBorderWidth:1.5,fill:false},
    {label:'Torque Der',data:vR,borderColor:'#c0392b',backgroundColor:'#c0392b',borderWidth:2,tension:.3,order:1,spanGaps:true,
     pointRadius:vR.map((v,i)=>i===lastIdx(vR)?5:2.5),
     pointBackgroundColor:vR.map((v,i)=>i===lastIdx(vR)?'#c0392b':'rgba(192,57,43,.5)'),
     pointBorderColor:'#fff',pointBorderWidth:1.5,fill:false}
  ];

  const liL=lastIdx(vL), liR=lastIdx(vR);
  const valueLabels={
    id:'valueLabels_'+cid,
    afterDatasetsDraw(chart){
      const {ctx:cx}=chart;
      const area=chart.chartArea;
      cx.save();
      function drawEndLabel(datasetIdx,idx,color,vals){
        if(idx<0)return;
        const meta=chart.getDatasetMeta(datasetIdx);
        const pt=meta.data[idx]; if(!pt)return;
        const txt=vals[idx].toFixed(2);
        cx.font='700 12px Segoe UI, sans-serif';
        const tw=cx.measureText(txt).width;
        const padX=6,padY=4,boxW=tw+padX*2,boxH=15+padY;
        let boxX=pt.x+8;
        if(boxX+boxW>area.right) boxX=pt.x-boxW-8;
        let boxY=pt.y-boxH/2;
        if(boxY<area.top) boxY=area.top;
        if(boxY+boxH>area.bottom) boxY=area.bottom-boxH;
        cx.fillStyle=color;
        cx.beginPath();
        cx.roundRect?cx.roundRect(boxX,boxY,boxW,boxH,4):cx.rect(boxX,boxY,boxW,boxH);
        cx.fill();
        cx.fillStyle='#fff';
        cx.textAlign='center';
        cx.fillText(txt,boxX+boxW/2,boxY+boxH-6);
      }
      drawEndLabel(0,liL,'#144272',vL);
      drawEndLabel(1,liR,'#c0392b',vR);
      cx.restore();
    }
  };

  const c=new Chart(ctx,{type:'line',data:{labels,datasets:ds},
    plugins:[valueLabels],
    options:{responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:16,right:56,left:8,bottom:4}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>(c.datasetIndex===0||c.datasetIndex===1)?`${c.dataset.label}: ${c.parsed.y!=null?c.parsed.y.toFixed(2):'-'}`:null,filter:(t)=>t.datasetIndex===0||t.datasetIndex===1}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:8}},
              y:{min:yMin,max:yMax,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10}}}}}});
  charts.push(c);
}
function dirText(m){
  if(m.k==='asym')return 'Diferencia entre piernas. Alerta si supera 15%.';
  if(m.dir==='down')return 'Alerta si baja respecto al promedio.';
  if(m.dir==='up')return 'Alerta si sube respecto al promedio (m&aacute;s lento = m&aacute;s fatiga).';
  return 'Se vigila el alejamiento respecto al promedio habitual.';
}

// Ventana de puntos a graficar en CMJ/CMRJ: evaluacion del dia + ultimas 3 previas = 4 puntos.
// Las bandas (SWC / +-1 desvio) se siguen calculando sobre el historico completo (excluyendo el ultimo),
// no solo sobre lo que se ve en pantalla, para que sean estadisticamente estables.
const CHART_WINDOW = 4;

function drawChart(cid,series,metric){
  const ctx=document.getElementById(cid);if(!ctx)return;
  const allPts=series.map(s=>({x:s.date,y:s[metric.k]})).filter(p=>p.y!==null&&p.y!==undefined);
  const st=statusOf(series,metric).status;
  const lastColor={g:'#1FA463',a:'#E8A317',r:'#D64545',n:'#8595A6'}[st];

  // Recorte a los ultimos CHART_WINDOW puntos para el grafico (solo visualizacion)
  const windowed = metric.k==='asym' ? allPts : allPts.slice(-CHART_WINDOW);
  const pts = windowed;
  const sc = metric.scale||1;
  const vals = pts.map(p=>p.y*sc);
  const labels=pts.map(p=>fmtDateShort(p.x));

  // ESCALA realista: min/max de los datos visibles con padding (sin bandas)
  const dmin=Math.min(...vals),dmax=Math.max(...vals);
  const range=dmax-dmin||1;
  const pad=range*0.15;
  let yMin=dmin-pad, yMax=dmax+pad;
  if(metric.k==='asym'){yMin=Math.min(-25,dmin-3);yMax=Math.max(25,dmax+3);}

  const ds=[
    {label:metric.label,data:vals,borderColor:'#144272',borderWidth:2,tension:.3,order:0,
     pointRadius:pts.map((p,i)=>i===pts.length-1?5:2.5),
     pointBackgroundColor:pts.map((p,i)=>i===pts.length-1?lastColor:'rgba(44,116,179,.5)'),
     pointBorderColor:'#fff',pointBorderWidth:1.5,fill:false}
  ];
  // Asimetria: lineas de referencia en los cortes 10 y 20 (bandas del semaforo), y el cero.
  if(metric.k==='asym'){
    ds.push({label:'lim20+',data:vals.map(()=>20),borderColor:'rgba(214,69,69,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,fill:false});
    ds.push({label:'lim20-',data:vals.map(()=>-20),borderColor:'rgba(214,69,69,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,fill:false});
    ds.push({label:'lim10+',data:vals.map(()=>10),borderColor:'rgba(232,163,23,.5)',borderWidth:1,borderDash:[3,3],pointRadius:0,fill:false});
    ds.push({label:'lim10-',data:vals.map(()=>-10),borderColor:'rgba(232,163,23,.5)',borderWidth:1,borderDash:[3,3],pointRadius:0,fill:false});
    ds.push({label:'zero',data:vals.map(()=>0),borderColor:'rgba(0,0,0,.15)',borderWidth:1,pointRadius:0,fill:false});
  }
  // plugin para mostrar el valor de cada punto (el ultimo mas grande y con fondo, para que se lea siempre)
  const valueLabels = {
    id:'valueLabels_'+cid,
    afterDatasetsDraw(chart){
      const {ctx:cx} = chart;
      const meta = chart.getDatasetMeta(0);
      if(!meta || !meta.data) return;
      cx.save();
      const n = meta.data.length;
      const area = chart.chartArea;
      meta.data.forEach((pt,i)=>{
        const isLast = i===n-1;
        const val = vals[i];
        if(val===null||val===undefined) return;
        const txt = val.toFixed(metric.dec)+(metric.unit||''); // val ya viene escalado
        // posicion vertical: si se iria por arriba del area, lo bajo
        let ty = pt.y-12;
        if(ty < area.top+10){ ty = pt.y+20; }
        let tx = pt.x;
        cx.textAlign='center';
        if(i===0 && !isLast){ cx.textAlign='left'; tx = pt.x - 2; }
        else if(isLast){ tx = Math.min(pt.x, area.right-2); }

        if(isLast){
          // fondo solido + texto grande para que el ultimo valor SIEMPRE se lea bien
          cx.font='700 13px Segoe UI, sans-serif';
          const tw = cx.measureText(txt).width;
          const padX=6, padY=4, boxW=tw+padX*2, boxH=16+padY;
          let boxX = tx-boxW/2;
          if(boxX+boxW > area.right) boxX = area.right-boxW;
          if(boxX < area.left) boxX = area.left;
          let boxY = ty-14;
          if(boxY < area.top) boxY = pt.y+8;
          cx.fillStyle = lastColor;
          cx.beginPath();
          cx.roundRect ? cx.roundRect(boxX,boxY,boxW,boxH,4) : cx.rect(boxX,boxY,boxW,boxH);
          cx.fill();
          cx.fillStyle = '#fff';
          cx.textAlign='center';
          cx.fillText(txt, boxX+boxW/2, boxY+boxH-6);
        } else {
          cx.font='600 10px Segoe UI, sans-serif';
          cx.fillStyle = '#5a6b7d';
          cx.fillText(txt, tx, ty);
        }
      });
      cx.restore();
    }
  };
  const c=new Chart(ctx,{type:'line',data:{labels,datasets:ds},
    plugins:[valueLabels],
    options:{responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:20,right:44,left:8,bottom:4}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>c.datasetIndex===0?`${metric.label}: ${fmtU(c.parsed.y,metric)}`:null,filter:(t)=>t.datasetIndex===0}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:8}},
              y:{min:yMin,max:yMax,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10}}}}}});
  charts.push(c);
}

document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');currentTab=t.dataset.tab;document.getElementById('promediosView').style.display='none';if(currentTab==='promedios'){renderPromedios();}else{renderTeam();}};});

fetch('../data.json?v=' + Date.now())
  .then(r => r.json())
  .then(d => {
    DATA = d;
    document.getElementById('genDate').textContent = 'Actualizado ' + fmtDate(DATA.generated.slice(0,10));
    renderTeam();
  })

    document.querySelector('main .wrap').innerHTML = '<div style="padding:40px;text-align:center;color:#8595A6"><h3 style="color:#002e4b">No se pudieron cargar los datos</h3><p>Verificá que el archivo data.json esté disponible. Si acabás de configurar el tablero, esperá a que corra la primera actualización.</p></div>';
    console.error('Error cargando data.json:', err);
  });
</script>
