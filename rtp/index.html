<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pumas 7s — Return to Play</title>
<style>
:root{
  --navy:#002e4b; --steel:#0a4368; --sky:#2C74B3; --ice:#A5D7E8;
  --paper:#F4F7FB; --ink:#0B1A2B; --line:#DDE7F0; --gold:#ffce00;
  --green:#1FA463; --amber:#E8A317; --red:#D64545; --grey:#8595A6;
  --f1:#D64545; --f2:#E8A317; --f3:#2C74B3; --f4:#1FA463;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(135deg,var(--navy),var(--steel));color:#fff;padding:22px 0}
.head-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.crest{width:64px;height:44px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.crest img{width:100%;height:100%;object-fit:contain}
.head-titles h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.head-titles p{font-size:13px;opacity:.7;margin-top:2px}
.head-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hbtn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
.hbtn:hover{background:rgba(255,255,255,.24)}
.hbtn.save{background:var(--gold);color:var(--navy);font-weight:700}
.hbtn.save:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-weight:400;cursor:default}
.demo-badge{background:#FCF2DD;color:#7A5F14;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
main{padding:22px 0 60px}
.msg{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}
.msg.show{display:block}.msg.ok{background:#E4F5EC;color:#146B41}.msg.error{background:#FBE4E4;color:#9E2B2B}

/* barra de casos */
.bar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar-top h2{font-size:15px;color:var(--navy)}
.btn{font:600 13px inherit;font-family:inherit;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--steel);background:var(--steel);color:#fff}
.btn.ghost{background:#fff;color:var(--steel)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn.ok{background:var(--green);border-color:var(--green)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:18px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px 18px;cursor:pointer;position:relative;overflow:hidden;text-align:left;font-family:inherit;color:inherit}
.ccard:hover{border-color:var(--sky);box-shadow:0 6px 20px rgba(20,66,114,.10)}
.ccard.sel{border-color:var(--steel);box-shadow:0 0 0 2px var(--steel) inset}
.ccard .sbar{position:absolute;left:0;top:0;bottom:0;width:5px}
.ccard h3{font-size:15px}
.ccard .sub{font-size:12px;color:var(--grey);margin-top:2px}
.ccard .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-g{background:#E4F5EC;color:var(--green)}.p-a{background:#FCF2DD;color:#A9750A}.p-r{background:#FBE4E4;color:var(--red)}.p-n{background:#EDF0F4;color:var(--grey)}.p-b{background:#E3EEF9;color:var(--sky)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--grey);font-size:13px}

/* seguimiento */
.follow{background:#fff;border:1px solid var(--line);border-left:4px solid var(--sky);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.follow h3{font-size:13.5px;color:var(--steel);margin-bottom:6px}

/* panel de caso */
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.panel-head{background:linear-gradient(135deg,var(--steel),var(--sky));color:#fff;padding:18px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.panel-head h2{font-size:20px}
.panel-head .meta{font-size:12.5px;opacity:.85;margin-top:3px}
.state{margin-left:auto;text-align:right}
.state .lbl{font-size:11px;opacity:.8}
.state .val{font-size:20px;font-weight:800}
.state .val.no{color:#FFB3B3}.state .val.dr{color:var(--gold)}.state .val.rec{color:#9BF0C4}
.track{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.ph{padding:12px 16px;border-right:1px solid var(--line);position:relative}
.ph:last-child{border-right:0}
.ph .top{height:4px;position:absolute;left:0;right:0;top:0;opacity:.25}
.ph.cur .top,.ph.done .top{opacity:1}
.ph .n{font-size:10.5px;font-weight:700;color:var(--grey);letter-spacing:.3px}
.ph .t{font-size:13.5px;font-weight:700;color:var(--navy)}
.ph .b{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.ph .b i{display:block;height:100%}
.ph .p{font-size:11.5px;color:var(--grey);margin-top:3px}
.flags{padding:10px 22px 4px;display:flex;flex-direction:column;gap:6px}
.flag{background:#FBE4E4;color:#9E2B2B;border-left:4px solid var(--red);padding:7px 12px;border-radius:0 8px 8px 0;font-size:12.5px}
.flag.info{background:#FCF2DD;color:#7A5F14;border-left-color:var(--amber)}

.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.sec>h3{font-size:15px;color:var(--navy);margin-bottom:2px}
.sec>.hint{font-size:12px;color:var(--grey);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--grey)}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
textarea{resize:vertical;min-height:60px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--steel)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrapc{white-space:normal;min-width:220px}
th{background:#F4F7FB;color:var(--grey);font-weight:600;font-size:11.5px}
tr:last-child td{border-bottom:0}
tr.hide{display:none}
tr.sub td{background:#FAFCFE;color:var(--grey);font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--grey)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phase-h{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.phase-h:first-of-type{margin-top:4px}
.phase-h .sw{width:10px;height:10px;border-radius:3px}
.phase-h b{font-size:13.5px;color:var(--navy)}
.phase-h span{font-size:12px;color:var(--grey)}
.dispbox{border:1px solid var(--line);border-radius:10px;padding:12px}
.dispbox.on{border-color:var(--amber);background:#FFF8E5}
.report{border:1px solid var(--line);border-radius:12px;padding:18px 20px;font-size:13px;line-height:1.55}
.report h4{font-size:13px;color:var(--steel);margin:12px 0 3px;border-bottom:2px solid var(--ice);display:inline-block}
.report h4:first-child{margin-top:0}
.report ul{padding-left:18px}
.rep-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rep-head img{height:34px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.newcase{border:2px solid var(--sky)}
@media(max-width:780px){.track{grid-template-columns:1fr 1fr}.twocol{grid-template-columns:1fr}.state{margin-left:0;text-align:left}}
@media print{
  body{background:#fff}
  header,.msg{display:none!important}
  main>*{display:none!important}
  body.print-live main>#viewCase{display:block!important}
  body.print-live #viewCase>*{display:none!important}
  body.print-live #viewCase>#secInforme{display:block!important;border:0;padding:0}
  body.print-snap main>#viewHist{display:block!important}
  body.print-snap #viewHist>*{display:none!important}
  body.print-snap #viewHist>#snapBox{display:block!important;border:0;padding:0}
  .actions,.noprint{display:none!important}
  .report{border:0;padding:0}
}

</style>
</head>

    {id:'demo-c',jugador:'Jugador Demo 3',puesto:'FWDS',tipo:'aductor',lesion:'Distensión aductor largo',region:'add',lado:'Izquierdo',fecha:'2026-08-14',bateria:'aductor',
     checks:{},pct:{},contacto:3,previas:'',pron:'',recom:'',disp:false,restr:'',tests:{},umb:{},extra:[],estado:'alta',fecha_alta:'2026-09-11',dias_baja:28,
     informe_final:'<p><b>Recuperado.</b> Alta el 11/09/2026 tras 28 días. Todos los criterios de campo cumplidos (informe de ejemplo).</p>',creado:'2026-08-15'}

/* ================= Estado global ================= */
let CARGA=null,DATA=null,PLAN=null,RTP={version:1,casos:[]};
let DEMO=false,DIRTY=false,SHA=null,SEL=null,VIEW='case';
const DEMO_KEY='rtp-demo-v3';

/* ================= Cálculos ================= */
function fechaSesion(sem,f){
  if(/^\d{4}-\d{2}-\d{2}/.test(f||''))return parseD(f);
  const m=String(f||'').match(/(\d{1,2})\/(\d{1,2})/); if(!m)return null;
  for(let i=0;i<7;i++){const d=addD(lunesDe(+sem),i);if(d.getDate()===+m[1]&&d.getMonth()+1===+m[2])return d}
  return null;
}
function sesionesJugador(name){
  const out=[];
  for(const [sem,lista] of Object.entries(CARGA?.sesiones||{}))
    for(const s of lista){const m=s.jugadores?.[name];if(!m)continue;
      out.push({sem:+sem,fecha:fechaSesion(sem,s.fecha),nombre:s.nombre,origen:s.origen,m})}
  return out.filter(s=>s.fecha).sort((a,b)=>a.fecha-b.fecha);
}
function objSesion(fecha,puesto){
  const w=PLAN?.semanas?.[semanaDe(fecha)]; if(!w||!puesto)return null;
  const dn=DIAS_ES[fecha.getDay()];
  const dia=Object.keys(w.dias||{}).find(k=>sinTilde(w.dias[k])===dn); if(!dia)return {dia:null,obj:null};
  const o=w.objetivo?.[dia]?.[puesto]; if(!o)return {dia,obj:null};
  const r={};VARS.forEach(v=>r[v.k]=valObj(o[v.k]));return {dia,obj:r};
}
function objSemana(n,puesto,hasta){
  const w=PLAN?.semanas?.[n]; if(!w||!puesto)return null;
  const r={};VARS.forEach(v=>r[v.k]=0);let tot=0,inc=0;
  for(const dia of Object.keys(w.dias||{})){const o=w.objetivo?.[dia]?.[puesto];if(!o)continue;tot++;
    const f=addD(lunesDe(n),OFFSET_DIA[sinTilde(w.dias[dia])]??0);if(hasta&&f>hasta)continue;inc++;
    VARS.forEach(v=>r[v.k]+=valObj(o[v.k])||0)}
  r._dias=inc;r._total=tot;return r;
}
/* fracción de la semana del plan ya transcurrida (1 si la semana terminó) */
function fracSemana(n){const w=PLAN?.semanas?.[n];if(!w)return 1;const ds=Object.values(w.dias||{});if(!ds.length)return 1;
  const h=hoy();return ds.filter(d=>addD(lunesDe(n),OFFSET_DIA[sinTilde(d)]??0)<=h).length/ds.length}
function totalSemana(name,n){
  const row=(CARGA?.roster?.[name]||[]).find(r=>r.semana===n);
  const r={};VARS.forEach(v=>r[v.k]=row?.datos?.[v.k]||0);return r;
}
const umbral=(c,id)=>({...UMB_DEF,...(c.umb?.[id]||{})});
const tipoCrit=(c,d)=>d.m.includes(c.region||'otra');

function evalTests(c,L){
  const bat=BATERIAS[c.bateria]||BATERIAS.otra;
  const lista=[...bat.tests,...(c.extra||[])];
  const vp=DATA?.players?.[c.jugador]||{};
  const lado=c.lado==='Izquierdo'?'left':c.lado==='Derecho'?'right':null;
  return lista.map(t=>{
    const u=umbral(c,t.id);const r={t,u,les:null,sano:null,base:null,fecha:null,def:null,pb:null,met:false,miss:null};
    if(t.auto){
      const arr=(vp[t.auto]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
      const pre=arr.filter(x=>parseD(x.date)<L),post=arr.filter(x=>parseD(x.date)>=L);
      if(t.auto==='nordic'){
        if(!lado){r.miss='cargar el lado lesionado';return r}
        const otro=lado==='left'?'right':'left';
        const lb=pre[pre.length-1],la=post[post.length-1];
        r.base=lb?lb[lado+'MaxForce']:null;
        if(la){r.les=la[lado+'MaxForce'];r.sano=la[otro+'MaxForce'];r.fecha=la.date}
      } else {
        const key=t.auto==='cmrj'?'CMRJ_REBOUND_RSI':'JUMP_HEIGHT';
        const lb=pre[pre.length-1],la=post[post.length-1];
        r.base=lb?lb[key]:null; if(la){r.les=la[key];r.fecha=la.date}
      }
    } else {
      const v=c.tests?.[t.id]||{};r.les=num(v.l);r.sano=num(v.s);r.base=num(v.b);r.fecha=v.f||null;
    }
    if(r.les===null){r.miss=t.auto?'sin test post-lesión':'sin cargar';return r}
    if(t.uni){
      if(r.sano===null){r.miss='falta lado sano';return r}
      r.def=(r.sano-r.les)/r.sano*100;
      if(r.base)r.pb=r.les/r.base*100;
      r.met=r.def<=u.def&&(r.pb===null||r.pb>=u.base);
    } else {
      if(!r.base){r.miss='sin baseline';return r}
      r.pb=r.les/r.base*100;r.met=r.pb>=u.base;
    }
    return r;
  });
}
function evalMCA(c,L){
  const arr=(DATA?.players?.[c.jugador]?.cmrj||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const pre=arr.filter(x=>parseD(x.date)<L).map(x=>x.CMRJ_REBOUND_RSI).filter(v=>v!=null);
  const post=arr.filter(x=>parseD(x.date)>=L);
  if(pre.length<3)return {miss:'menos de 3 tests pre-lesión'};
  const mean=pre.reduce((a,b)=>a+b,0)/pre.length;
  const sd=Math.sqrt(pre.reduce((a,b)=>a+(b-mean)**2,0)/(pre.length-1));
  const t=mean-0.6*sd; const last=post[post.length-1];
  if(!last)return {t,miss:'sin test post-lesión'};
  return {t,v:last.CMRJ_REBOUND_RSI,met:last.CMRJ_REBOUND_RSI>=t,fecha:last.date};
}

function calcular(c){
  const L=parseD(c.fecha)||hoy();const fin=c.estado==='alta'?parseD(c.fecha_alta):hoy();
  const semL=semanaDe(L),semHoy=semanaDe(fin);
  const ses=sesionesJugador(c.jugador).filter(s=>s.fecha>=L&&s.fecha<=fin).map(s=>{
    const o=objSesion(s.fecha,c.puesto);const p={};
    VARS.forEach(v=>{const ob=o?.obj?.[v.k];p[v.k]=ob?s.m[v.k]/ob*100:null});
    return {...s,dia:o?.dia||null,obj:o?.obj||null,p};
  });
  const semanas=[];
  for(let n=Math.max(1,semL-3);n<=semHoy;n++){
    const curso=n===semanaDe(hoy())&&c.estado!=='alta';
    const tot=totalSemana(c.jugador,n),ob=objSemana(n,c.puesto,curso?hoy():null);
    const prev=[1,2,3].map(i=>n-i>=1?totalSemana(c.jugador,n-i):null).filter(Boolean);
    const acwr={},pct={},inc={};
    const prevW=n>1?totalSemana(c.jugador,n-1):null;
    VARS.forEach(v=>{
      const ch=prev.length===3?prev.reduce((a,p)=>a+p[v.k],0)/3:null;
      acwr[v.k]=ch?tot[v.k]/ch:null;
      pct[v.k]=ob&&ob[v.k]?tot[v.k]/ob[v.k]*100:null;
      inc[v.k]=prevW&&prevW[v.k]?(tot[v.k]-prevW[v.k])/prevW[v.k]*100:null;
    });
    semanas.push({n,tot,ob,acwr,pct,inc,pre:n<semL,lesion:n===semL,curso});
  }
  const post=semanas.filter(w=>w.n>semL);
  const tests=evalTests(c,L);
  const mca=evalMCA(c,L);
  const preBest=Math.max(0,...(CARGA?.roster?.[c.jugador]||[]).filter(r=>r.semana<semL&&r.datos).map(r=>r.datos.vmax||0));

  const ev={};
  for(const d of CRIT){
    if(!tipoCrit(c,d)){ev[d.id]=null;continue}
    const p=num(c.pct?.[d.id])??d.pct;let r={met:false};
    if(d.ty==='check')r={met:!!c.checks?.[d.id]};
    else if(d.ty==='cont')r={met:(c.contacto||0)>=d.lvl,shown:CONTACTO[c.contacto||0]};
    else if(d.ty==='ses'){const vals=ses.map(s=>s.p[d.v]).filter(x=>x!==null);const b=vals.length?Math.max(...vals):null;
      r={met:b!==null&&b>=p,shown:b===null?'—':`mejor ${fmt(b)}%`,miss:ses.length?null:'sin sesiones'}}
    else if(d.ty==='week'){
      const mins=post.filter(w=>!w.curso).map(w=>{const vs=d.vs.filter(k=>w.ob&&w.ob[k]);if(!vs.length)return null;return Math.min(...vs.map(k=>w.pct[k]))}).filter(x=>x!==null);
      const b=mins.length?Math.max(...mins):null;
      r={met:b!==null&&b>=p,shown:b===null?'—':`mejor semana ${fmt(b)}%`,miss:PLAN?null:'sin objetivo'}}
    else if(d.ty==='vmax'){const vals=ses.map(s=>s.m.pct).filter(Boolean);const b=vals.length?Math.max(...vals):null;
      const vk=ses.length?Math.max(...ses.map(s=>s.m.vmax||0)):null;
      r={met:b!==null&&b>=p,shown:b===null?'—':`${fmt(b,1)}% (${fmt(vk,1)} km/h)`}}
    else if(d.ty==='eval'){const n=tests.filter(t=>t.met).length;r={met:tests.length>0&&n===tests.length,shown:tests.length?`${n}/${tests.length} en criterio`:'—',miss:tests.length?null:'sin batería'}}
    else if(d.ty==='mca')r={met:!!mca.met,shown:mca.v!=null?`${fmt(mca.v,2)} (mín. ${fmt(mca.t,2)})`:'—',miss:mca.miss&&!mca.v?mca.miss:null};
    else if(d.ty==='acwr'){const ws=post.filter(w=>Object.values(w.acwr).some(x=>x!==null));const last=ws.slice(-2);
      const mx=last.length?Math.max(...last.flatMap(w=>Object.values(w.acwr).filter(x=>x!==null))):null;
      r={met:mx!==null&&mx<=1.5,shown:mx===null?'—':`máx. ${mx.toFixed(2)}`}}
    r.p=p;ev[d.id]=r;
  }
  const fase={};let tot=0,ok=0;const pend=[];
  FASES.forEach(f=>{const ds=CRIT.filter(d=>d.f===f.id&&ev[d.id]);const m=ds.filter(d=>ev[d.id].met);
    fase[f.id]=ds.length?m.length/ds.length:0;tot+=ds.length;ok+=m.length;
    ds.filter(d=>!ev[d.id].met).forEach(d=>pend.push({f,d,miss:ev[d.id].miss}))});
  const cur=FASES.find(f=>fase[f.id]<1)||null;
  const estado=c.estado==='alta'?'alta':(pend.length===0?'rec':(c.disp?'dr':'no'));

  const flags=[];
  if(!ses.length&&diffD(L,hoy())>2)flags.push(['Sin sesiones de rehab en Catapult','el crónico no se está midiendo. Verificar que la actividad esté creada en el grupo SEVEN.']);
  if(DATA&&!DATA.players?.[c.jugador])flags.push(['Sin datos de VALD','no encontré al jugador en data.json: revisar que el nombre coincida con el de Catapult.','info']);
  if(!PLAN)flags.push(['Sin objetivo semanal','todavía no hay plan.json desde la hoja: los % contra objetivo no se pueden calcular.','info']);
  const spike=post.slice(-2).some(w=>Object.values(w.acwr).some(x=>x!==null&&x>1.5));
  if(spike)flags.push(['Pico de carga','ACWR mayor a 1,5 en alguna variable en las últimas dos semanas.']);
  const incs=post.slice(-1).flatMap(w=>VARS.filter(v=>w.inc[v.k]!==null&&w.inc[v.k]>TOPE_INC&&!w.curso).map(v=>v.t));
  if(incs.length)flags.push(['Incremento semanal',`${incs.join(', ')} subió más de ${TOPE_INC}% respecto de la semana previa.`]);
  if(estado==='dr'){
    if(!(ev.m1?.met&&ev.m2?.met))flags.push(['Sin exposición a velocidad máxima','habilitado sin sprint sin dolor al % objetivo. Riesgo elevado de recidiva.']);
    if(fase[3]<1)flags.push(['Mecanismo e intensidad incompleta','sin exposición completa al mecanismo de lesión.']);
    if(fase[4]<1)flags.push(['Semana completa sin cumplir','no toleró todavía una semana al 100% del objetivo.']);
    if((c.contacto||0)<2)flags.push(['Contacto insuficiente',`habilitado en "${CONTACTO[c.contacto||0]}".`]);
  }
  return {L,fin,semL,ses,semanas,post,tests,mca,preBest,ev,fase,cur,estado,pend,flags,total:tot?ok/tot:0};
}
const ESTADO_TXT={no:'No disponible',dr:'Disponible con riesgo',rec:'Recuperado',alta:'Alta'};

const cerrados=()=>RTP.casos.filter(c=>c.estado==='alta').sort((a,b)=>(b.fecha_alta||'').localeCompare(a.fecha_alta||''));

}
const lesionTxt=c=>[LESIONES[c.tipo]?.t,c.lesion].filter(Boolean).join(' · ')||'Sin diagnóstico';
function previasAuto(c){return cerrados().filter(x=>x.jugador===c.jugador&&x.id!==c.id).map(x=>`${lesionTxt(x)} (alta ${fLarga(parseD(x.fecha_alta))})`)}

function renderFollow(){

  if(!f.length){$('#follow').innerHTML='';return}
  const rows=f.map(c=>{
    const L=parseD(c.fecha),semL=semanaDe(L),A=parseD(c.fecha_alta),semA=semanaDe(A);
    const base={};VARS.forEach(v=>{const w=[1,2,3].map(i=>totalSemana(c.jugador,semL-i)[v.k]);base[v.k]=w.reduce((a,b)=>a+b,0)/3});
    const ws=[];for(let n=semA;n<=semanaDe(hoy());n++)ws.push(n);
    const cells=ws.map(n=>{const t=totalSemana(c.jugador,n);const fr=fracSemana(n);

      return `<td class="num">S${n}${fr<1?' <span class="muted">(en curso)</span>':''}: ${r.map((x,i)=>`<span class="pill ${segCls(x)}">${['Dist','HSR','DS'][i]} ${x??'—'}</span>`).join(' ')}</td>`}).join('');

}

      <label class="f">Lesión<select data-f="tipo" data-rerender="1">${Object.entries(LESIONES).map(([k,l])=>`<option value="${k}" ${c.tipo===k?'selected':''}>${l.t}</option>`).join('')}</select></label>

      <label class="f">Lado<select data-f="lado">${['Izquierdo','Derecho','Bilateral','No aplica'].map(x=>`<option ${c.lado===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="f">Fecha de lesión<input type="date" data-f="fecha" value="${esc(c.fecha)}"></label>
      <label class="f">Puesto<select data-f="puesto"><option value="">—</option>${['FWDS','BACKS'].map(x=>`<option ${c.puesto===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="f">Batería de evaluación<input value="${esc((BATERIAS[c.bateria]||BATERIAS.otra).tests.length?(BATERIAS[c.bateria]||BATERIAS.otra).t+' (según la lesión)':'Pendiente: cargá los tests a mano')}" disabled></label>
    </div>
    <label class="f" style="margin-top:10px">Lesiones previas relevantes
      <input data-f="previas" value="${esc(c.previas)}" placeholder="${esc(previasAuto(c).join(' · ')||'Sin registros previos en el historial')}"></label>
  </div>

  <div class="sec">
    <h3>Evolución</h3><p class="hint">Registro fechado de cada día: qué hizo, cómo respondió y qué sigue. Queda firmado con el nombre de quien lo carga y lo ve todo el equipo.</p>
    <div class="grid">
      <label class="f">Fecha<input type="date" id="evFecha" value="${isoD(hoy())}"></label>
      <label class="f">Cargado por<input id="evAutor" value="${esc(autorGuardado())}" placeholder="Tu nombre"></label>
      <label class="f">Dolor (0-10)<input type="number" id="evDolor" min="0" max="10" step="1"></label>
    </div>
    <div class="grid" style="margin-top:10px">
      <label class="f">Qué hizo<textarea id="evHizo" placeholder="Sesión, contenidos, carga"></textarea></label>
      <label class="f">Cómo respondió<textarea id="evResp" placeholder="Síntomas, reacción a 24 h, sensaciones"></textarea></label>
      <label class="f">Plan / próximo paso<textarea id="evPlan"></textarea></label>
    </div>
    <div class="actions"><button class="btn" id="btnEv">Agregar a la evolución</button></div>
    <div id="evList" style="margin-top:14px"></div>
  </div>

  <div class="sec">
    <h3>Carga de campo</h3><p class="hint">Sesiones del jugador en Catapult desde la lesión. Al lado de cada valor: % del objetivo de ese día para su puesto, según la hoja del PF.
      <span class="pill p-b">en progreso</span> todavía debajo del objetivo (no es alerta: en rehab es lo esperable) · <span class="pill p-g">objetivo cumplido</span> ≥ 100% · <span class="pill p-n">—</span> ese día el plan no tiene objetivo para esa variable</p>
    <div class="scroll"><table><thead><tr><th>Fecha</th><th>Sesión</th><th>Día del plan</th>${VARS.map(v=>`<th>${v.t}</th>`).join('')}<th>%Vmax</th></tr></thead><tbody id="sesBody"></tbody></table></div>
    <h3 style="margin-top:16px;font-size:14px">Semanas: cumplimiento y ACWR</h3>
    <p class="hint">Primer número: % del objetivo semanal de su puesto (la semana en curso se compara solo contra los días del plan ya transcurridos). Segundo número: ACWR, la carga de esa semana dividida por el promedio de las 3 anteriores, incluidas las previas a la lesión.
      Colores del % igual que arriba. El ACWR se marca en <b style="color:var(--red)">rojo</b> solo cuando pasa 1,5: subió demasiado rápido respecto de lo que venía haciendo.</p>
    <div class="scroll"><table><thead><tr><th>Semana</th>${VARS.map(v=>`<th>${v.t}<br><span style="font-weight:400">% obj · ACWR</span></th>`).join('')}<th></th></tr></thead><tbody id="semBody"></tbody></table></div>
  </div>

  <div class="sec">
    <h3>Evaluación objetiva</h3><p class="hint">Los tests de VALD se completan solos: baseline = último test antes de la lesión, actual = último después. Los demás se cargan a mano. Baterías y umbrales de ejemplo, a reemplazar por la lista del equipo.</p>
    <div class="scroll"><table><thead><tr><th>Test</th><th>Origen</th><th>Lesionado / valor</th><th>Sano</th><th>Baseline</th><th>Déficit vs sano</th><th>% del baseline</th><th>Criterio</th><th>Estado</th><th></th></tr></thead>
    <tbody id="testBody">${testRows(c)}</tbody></table></div>
    <div class="actions noprint" style="align-items:flex-end">
      <label class="f">Equipo<select id="nxEq"><option>DynaMo</option><option>ForceDecks</option><option>NordBord</option><option>Campo</option><option>Otro</option></select></label>
      <label class="f">Test<input id="nxTest" placeholder="Ej. Extensión de rodilla"></label>
      <label class="f">Métrica<input id="nxMet" placeholder="Ej. Fuerza pico (N)"></label>
      <label class="f">Tipo<select id="nxUni"><option value="1">Unilateral</option><option value="0">Bilateral</option></select></label>
      <button class="btn ghost" id="btnAddTest">Agregar test manual</button>
    </div>
  </div>

  <div class="sec">
    <h3>Criterios por fase</h3><p class="hint">Los de carga, velocidad, evaluación y ACWR se evalúan solos. Solo se muestran los que aplican a la región elegida.</p>
    ${FASES.map(f=>`<div class="phase-h"><span class="sw" style="background:${f.c}"></span><b>${f.t}</b><span>${f.obj}</span><span class="pill p-n" id="fp_${f.id}"></span></div>
      <div class="scroll"><table><thead><tr><th>Criterio</th><th>Objetivo</th><th>Logrado</th><th>Estado</th></tr></thead><tbody>
      ${CRIT.filter(d=>d.f===f.id).map(d=>critRow(c,d)).join('')}</tbody></table></div>`).join('')}
  </div>

  <div class="sec">
    <h3>Contacto y decisión</h3><p class="hint" id="decStamp"></p>
    <div class="twocol">
      <div>
        <label class="f">Nivel de contacto<select data-f="contacto" data-num="1">${CONTACTO.map((x,i)=>`<option value="${i}" ${(c.contacto||0)===i?'selected':''}>${x}</option>`).join('')}</select></label>
        <label class="f" style="margin-top:10px">Pronóstico<textarea data-f="pron">${esc(c.pron)}</textarea></label>
        <label class="f" style="margin-top:10px">Recomendación<textarea data-f="recom">${esc(c.recom)}</textarea></label>
      </div>
      <div class="dispbox ${c.disp?'on':''}" id="dispBox">
        <label style="display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px"><input type="checkbox" data-f="disp" ${c.disp?'checked':''}> Disponible con riesgo para la convocatoria</label>
        <p class="muted" style="font-size:12px;margin:6px 0 10px">Decisión manual. "Recuperado" se calcula solo cuando se cumplen todos los criterios.</p>
        <label class="f">Restricciones<textarea data-f="restr">${esc(c.restr)}</textarea></label>
      </div>
    </div>
  </div>

  <div class="sec" id="secInforme">
    <h3 class="noprint">Informe para cuerpo técnico / médico</h3><p class="hint noprint">Estado, fases, tests, riesgos y pendientes se arman solos. Pronóstico y recomendación salen de lo que escribas arriba.</p>
    <div class="report" id="report"></div>
    <div class="actions">
      <button class="btn ghost" id="btnPrint">Imprimir informe</button>
      <button class="btn ok" id="btnAlta">Dar alta</button>
      <button class="btn danger" id="btnDel">Eliminar tratamiento</button>
    </div>
  </div>`;
  refresh();
}

function informeHTML(c,k,final){
  const lastW=k.post.filter(w=>!w.curso).slice(-1)[0];
  const wk=lastW&&lastW.ob?VARS.map(v=>`${v.t} ${lastW.pct[v.k]===null?'—':fmt(lastW.pct[v.k])+'%'}`).join(', '):'sin datos';
  const tests=k.tests.map(r=>`<li>${esc(r.t.eq)} ${esc(r.t.test)}: ${r.miss?esc(r.miss):`${r.def!==null?`déficit ${fmt(r.def,1)}% · `:''}${r.pb!==null?`${fmt(r.pb,1)}% del baseline · `:''}${r.met?'en criterio':'fuera de criterio'}`}</li>`).join('');
  const prev=[c.previas,...previasAuto(c)].filter(Boolean).join(' · ');
  const est=final?`Alta el ${fLarga(parseD(c.fecha_alta))}, ${c.dias_baja} días de baja`:ESTADO_TXT[k.estado];
  return `<div class="rep-head"><div><b style="font-size:15px">${esc(c.jugador)}</b> · ${esc(c.puesto||'')}<br><span class="muted">${esc(lesionTxt(c))} · ${esc(c.lado||'')} · lesión ${fLarga(k.L)}${prev?` · previas: ${esc(prev)}`:''}</span></div>
    <div style="text-align:right"><img src="${CREST}" alt=""><br><span class="muted">${final?'Informe de alta':'Día '+diffD(k.L,hoy())+' post-lesión'}</span></div></div>
    <h4>Estado actual</h4>
    <p><b>${est}</b>. Readaptación de campo ${Math.round(k.total*100)}%${k.cur?`, fase actual: ${esc(k.cur.t)}`:''} (${FASES.map(f=>`${f.t} ${Math.round(k.fase[f.id]*100)}%`).join(' · ')}). Última semana completa vs objetivo: ${wk}. Contacto: ${CONTACTO[c.contacto||0]}.</p>
    ${tests?`<ul>${tests}</ul>`:''}
    ${(c.evolucion||[]).length?`<h4>Evolución reciente</h4><ul>${evOrden(c).slice(0,3).map(e=>`<li><b>${fLarga(parseD(e.fecha))}${e.autor?' · '+esc(e.autor):''}${e.dolor!==''&&e.dolor!=null?' · dolor '+esc(e.dolor)+'/10':''}:</b> ${esc([e.hizo,e.resp&&'Respuesta: '+e.resp,e.plan&&'Plan: '+e.plan].filter(Boolean).join(' · '))}</li>`).join('')}</ul>`:''}
    <h4>Pronóstico</h4><p>${esc(c.pron)||'<span class="muted">Sin cargar.</span>'}</p>
    <h4>Recomendación</h4><p>${esc(c.recom)||'<span class="muted">Sin cargar.</span>'}</p>${c.disp&&c.restr?`<p><b>Restricciones:</b> ${esc(c.restr)}</p>`:''}
    ${k.flags.filter(f=>!f[2]).length?`<h4>Riesgos explícitos</h4><ul>${k.flags.filter(f=>!f[2]).map(f=>`<li><b>${esc(f[0])}:</b> ${esc(f[1])}</li>`).join('')}</ul>`:''}
    ${c.dec_act?`<p class="muted" style="font-size:11.5px">Pronóstico y recomendación actualizados el ${fLarga(parseD(c.dec_act.fecha))}${c.dec_act.autor?' por '+esc(c.dec_act.autor):''}.</p>`:''}
    <h4>Qué falta para el alta</h4>${k.pend.length?`<ul>${k.pend.map(p=>`<li>${esc(p.f.t)}: ${esc(p.d.x)}${p.miss?` (${esc(p.miss)})`:''}</li>`).join('')}</ul>`:'<p>Todos los criterios de campo cumplidos.</p>'}`;
}

function refresh(){
  renderCases();renderFollow();
  const c=caso(SEL); if(!c||c.estado==='alta'||VIEW!=='case')return;
  const k=calcular(c);
  $('#hMeta').textContent=`${c.puesto||'Sin puesto'} · ${lesionTxt(c)} · ${c.lado||''} · lesión ${fLarga(k.L)} · día ${diffD(k.L,hoy())}`;
  $('#hState').textContent=ESTADO_TXT[k.estado];$('#hState').className='val '+k.estado;
  $('#hPct').textContent=`Readaptación ${Math.round(k.total*100)}%`;
  $('#track').innerHTML=FASES.map(f=>{const v=k.fase[f.id];return `<div class="ph ${v>=1?'done':''} ${k.cur===f?'cur':''}"><span class="top" style="background:${f.c}"></span>
    <div class="n">FASE ${f.id}</div><div class="t">${f.t}</div><div class="b"><i style="width:${Math.round(v*100)}%;background:${f.c}"></i></div><div class="p">${Math.round(v*100)}%</div></div>`}).join('');
  $('#flags').innerHTML=k.flags.map(f=>`<div class="flag ${f[2]?'info':''}"><b>${esc(f[0])}:</b> ${esc(f[1])}</div>`).join('');
  $('#dispBox').classList.toggle('on',!!c.disp);
  // sesiones
  $('#sesBody').innerHTML=k.ses.length?k.ses.map(s=>`<tr><td>${fCorta(s.fecha)}</td><td>${esc(s.nombre)}</td><td>${s.dia?'Día '+s.dia:'<span class="muted">fuera del plan</span>'}</td>
    ${VARS.map(v=>`<td class="num">${fmt(s.m[v.k])} <span class="pill ${pctCls(s.p[v.k])}">${s.p[v.k]===null?'—':fmt(s.p[v.k])+'%'}</span></td>`).join('')}<td class="num">${fmt(s.m.pct,1)}%</td></tr>`).join('')
    :'<tr><td colspan="9" class="muted">Todavía no hay sesiones del jugador en Catapult desde la lesión.</td></tr>';
  // semanas
  $('#semBody').innerHTML=k.semanas.map(w=>{
    const tag=w.pre?'<span class="pill p-n">pre-lesión</span>':w.lesion?'<span class="pill p-n">semana de lesión</span>':w.curso?`<span class="pill p-b">en curso · ${w.ob?w.ob._dias+'/'+w.ob._total+' días del plan':''}</span>`:'';
    const spike=Object.values(w.acwr).some(x=>x!==null&&x>1.5)&&!w.pre;
    return `<tr><td>S${w.n} · ${fCorta(lunesDe(w.n))}</td>${VARS.map(v=>{const a=w.acwr[v.k],p=w.pct[v.k];
      return `<td class="num"><span class="pill ${w.pre?'p-n':pctCls(p)}">${p===null?'—':fmt(p)+'%'}</span> <span style="${a!==null&&a>1.5&&!w.pre?'color:var(--red);font-weight:700':'color:var(--grey)'}">${a===null?'—':a.toFixed(2)}</span></td>`}).join('')}
      <td>${tag} ${spike?'<span class="pill p-r">pico</span>':''}</td></tr>`}).join('');
  // tests
  k.tests.forEach(r=>{const id=r.t.id;
    if(r.t.auto){const set=(x,v,d)=>{const e=document.getElementById(`tv_${id}_${x}`);if(e)e.textContent=v===null?'—':fmt(v,d)};
      const d=r.t.auto==='cmrj'?2:1;set('l',r.les,d);set('s',r.sano,d);set('b',r.base,d);}
    $('#td_'+id).textContent=r.def===null?'—':fmt(r.def,1)+'%';
    $('#tb_'+id).textContent=r.pb===null?'—':fmt(r.pb,1)+'%';
    $('#ts_'+id).innerHTML=r.met?'<span class="pill p-g">En criterio</span>':r.miss?`<span class="pill p-a">${esc(r.miss)}</span>`:'<span class="pill p-r">Fuera</span>';
  });
  // criterios
  FASES.forEach(f=>{const el=$('#fp_'+f.id),v=k.fase[f.id];el.textContent=Math.round(v*100)+'%';el.className='pill '+(v>=1?'p-g':v>0?'p-a':'p-n')});
  CRIT.forEach(d=>{const r=k.ev[d.id];const row=$('#cr_'+d.id);row.classList.toggle('hide',!r);if(!r)return;
    if(d.ty!=='check')$('#ca_'+d.id).textContent=r.shown??'—';
    $('#cs_'+d.id).innerHTML=r.met?'<span class="pill p-g">Cumplido</span>':r.miss?`<span class="pill p-a">${esc(r.miss)}</span>`:'<span class="pill p-r">Pendiente</span>';});
  renderEv(c);
  $('#decStamp').textContent=c.dec_act?`Última actualización: ${fLarga(parseD(c.dec_act.fecha))}${c.dec_act.autor?' · '+c.dec_act.autor:''}`:'';
  $('#report').innerHTML=informeHTML(c,k,false);
}

function renderHist(){
  const h=cerrados();
  $('#viewHist').innerHTML=`<div class="sec"><h3>Historial de tratamientos</h3><p class="hint">Casos con alta. El informe queda congelado tal como estaba el día del alta.</p>
    <div class="scroll"><table><thead><tr><th>Jugador</th><th>Lesión</th><th>Fecha de lesión</th><th>Alta</th><th>Días de baja</th><th></th></tr></thead><tbody>
    ${h.length?h.map(c=>`<tr><td><b>${esc(c.jugador)}</b></td><td>${esc(lesionTxt(c))}</td><td>${fLarga(parseD(c.fecha))}</td><td>${fLarga(parseD(c.fecha_alta))}</td><td class="num">${c.dias_baja??'—'}</td>
      <td><button class="btn ghost" data-snap="${c.id}">Ver informe de alta</button> <button class="btn ghost" data-reopen="${c.id}">Reabrir</button></td></tr>`).join('')
      :'<tr><td colspan="6" class="muted">Todavía no hay altas registradas.</td></tr>'}
    </tbody></table></div></div><div class="sec" id="snapBox" hidden></div>`;
}
function showView(v){VIEW=v;$('#viewCase').hidden=v!=='case';$('#viewHist').hidden=v!=='hist';if(v==='hist')renderHist();renderCases()}

function renderNew(){
  const act=new Set(activos().map(c=>c.jugador));
  const jug=Object.keys(CARGA?.roster||{}).sort().filter(n=>!act.has(n));
  $('#newBox').innerHTML=`<div class="sec newcase"><h3>Nuevo tratamiento</h3><p class="hint">La lista de jugadores sale del plantel del tablero (Catapult). Al elegir la lesión se cargan solos los criterios y la batería de evaluación.</p>
   <div class="grid">
    <label class="f">Jugador<select id="nJug"><option value="">Elegí un jugador</option>${jug.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label>
    <label class="f">Puesto<select id="nPue"><option value="">—</option><option>FWDS</option><option>BACKS</option></select></label>
    <label class="f">Lesión<select id="nTipo">${Object.entries(LESIONES).map(([k,l])=>`<option value="${k}">${l.t}</option>`).join('')}</select></label>
    <label class="f">Detalle (grado, estructura)<input id="nLes" placeholder="Ej. grado II, LTAA"></label>
    <label class="f">Lado<select id="nLado"><option>Izquierdo</option><option>Derecho</option><option>Bilateral</option><option>No aplica</option></select></label>
    <label class="f">Fecha de lesión<input type="date" id="nFec" value="${isoD(hoy())}"></label>
    <label class="f">Batería de evaluación<input id="nBat" disabled></label>
   </div>
   <div class="actions"><button class="btn" id="nOk">Crear tratamiento</button><button class="btn ghost" id="nCancel">Cancelar</button></div></div>`;
  const setBat=()=>{const l=LESIONES[$('#nTipo').value],bt=BATERIAS[l.bat];$('#nBat').value=bt&&bt.tests.length?bt.t:'Pendiente: cargá los tests a mano'};
  $('#nTipo').onchange=setBat;setBat();
  $('#nJug').onchange=e=>{const p=PLAN?.plantel?.[e.target.value];if(p)$('#nPue').value=p};
  $('#nCancel').onclick=()=>$('#newBox').innerHTML='';
  $('#nOk').onclick=()=>{
    const j=$('#nJug').value;if(!j){msg('Elegí un jugador.','error');return}
    const c={id:'c'+Date.now(),jugador:j,puesto:$('#nPue').value,tipo:$('#nTipo').value,lesion:$('#nLes').value,region:LESIONES[$('#nTipo').value].region,lado:$('#nLado').value,fecha:$('#nFec').value,
      bateria:LESIONES[$('#nTipo').value].bat,checks:{},pct:{},contacto:0,previas:'',pron:'',recom:'',disp:false,restr:'',tests:{},umb:{},extra:[],estado:'activo',creado:isoD(hoy())};
    RTP.casos.push(c);SEL=c.id;$('#newBox').innerHTML='';dirty();showView('case');renderCase();
  };
}

/* ================= Eventos ================= */
function msg(t,cls='ok'){const m=$('#msg');m.textContent=t;m.className='msg show '+cls;clearTimeout(msg._t);msg._t=setTimeout(()=>m.className='msg',5000)}
function dirty(){DIRTY=true;$('#btnSave').disabled=false;if(DEMO)guardar(true)}
document.addEventListener('input',e=>{
  const el=e.target,c=caso(SEL);if(!c)return;
  if(el.dataset.f){let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.num)v=+v;c[el.dataset.f]=v;
    if(['pron','recom','restr','disp','contacto'].includes(el.dataset.f))c.dec_act={fecha:isoD(hoy()),autor:autorGuardado()};
    if(el.dataset.rerender)return;}
  else if(el.dataset.chk){c.checks=c.checks||{};c.checks[el.dataset.chk]=el.checked}
  else if(el.dataset.pct){c.pct=c.pct||{};c.pct[el.dataset.pct]=el.value}
  else if(el.dataset.test){c.tests=c.tests||{};c.tests[el.dataset.test]=c.tests[el.dataset.test]||{};c.tests[el.dataset.test][el.dataset.k]=el.value}
  else if(el.dataset.umb){c.umb=c.umb||{};c.umb[el.dataset.umb]=c.umb[el.dataset.umb]||{};c.umb[el.dataset.umb][el.dataset.k]=num(el.value)??UMB_DEF[el.dataset.k]}
  else return;
  dirty();refresh();
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.rerender){const c=caso(SEL);if(!c)return;c[el.dataset.f]=el.value;
    if(el.dataset.f==='tipo'){const l=LESIONES[el.value];c.region=l.region;c.bateria=l.bat}dirty();renderCase()}
  else if(el.type==='checkbox'||el.tagName==='SELECT')el.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.open){SEL=b.dataset.open;showView('case');renderCase();return}
  if(b.dataset.delev){const c=caso(SEL);if(!confirm('¿Borrar este registro de la evolución?'))return;c.evolucion=(c.evolucion||[]).filter(e=>e.id!==b.dataset.delev);dirty();refresh();return}
  if(b.dataset.deltest){const c=caso(SEL);c.extra=(c.extra||[]).filter(t=>t.id!==b.dataset.deltest);dirty();renderCase();return}
  if(b.dataset.snap){const c=caso(b.dataset.snap);const box=$('#snapBox');box.hidden=false;
    box.innerHTML=`<div class="report">${c.informe_final||'<p class="muted">Sin informe guardado.</p>'}</div><div class="actions"><button class="btn ghost" id="btnPrintSnap">Imprimir</button></div>`;
    $('#btnPrintSnap').onclick=()=>imprimir('print-snap');box.scrollIntoView?.({behavior:'smooth'});return}
  if(b.dataset.reopen){const c=caso(b.dataset.reopen);if(!confirm(`¿Reabrir el tratamiento de ${c.jugador}? Vuelve a tratamientos activos y se descarta la fecha de alta.`))return;
    c.estado='activo';delete c.fecha_alta;delete c.dias_baja;delete c.informe_final;SEL=c.id;dirty();showView('case');renderCase();return}
  switch(b.id){
    case 'btnNew':renderNew();break;
    case 'btnHist':showView(VIEW==='hist'?'case':'hist');break;
    case 'btnSave':guardar(false);break;
    case 'btnPrint':imprimir('print-live');break;
    case 'btnEv':{const c=caso(SEL);const hizo=$('#evHizo').value.trim(),resp=$('#evResp').value.trim(),plan=$('#evPlan').value.trim();
      if(!hizo&&!resp&&!plan){msg('Escribí al menos qué hizo, cómo respondió o el plan.','error');return}
      const autor=$('#evAutor').value.trim();try{localStorage.setItem('rtp_autor',autor)}catch(e){}
      c.evolucion=c.evolucion||[];c.evolucion.push({id:'e'+Date.now(),fecha:$('#evFecha').value||isoD(hoy()),autor,dolor:$('#evDolor').value,hizo,resp,plan,creado:new Date().toISOString()});
      ['#evHizo','#evResp','#evPlan','#evDolor'].forEach(s=>$(s).value='');
      dirty();refresh();if(!DEMO)guardar(false);else msg('Registro agregado.');break}
    case 'btnAddTest':{const c=caso(SEL);const t=$('#nxTest').value.trim();if(!t){msg('Poné el nombre del test.','error');return}
      c.extra=c.extra||[];c.extra.push({id:'x'+Date.now(),eq:$('#nxEq').value,test:t,met:$('#nxMet').value.trim()||'Valor',uni:$('#nxUni').value==='1',adhoc:true});
      dirty();renderCase();break}
    case 'btnAlta':{const c=caso(SEL);const k=calcular(c);
      const txt=k.pend.length?`Quedan ${k.pend.length} criterio(s) pendientes. ¿Dar el alta igual a ${c.jugador}?`:`¿Dar el alta a ${c.jugador}?`;
      if(!confirm(txt))return;
      c.estado='alta';c.fecha_alta=isoD(hoy());c.dias_baja=diffD(k.L,hoy());
      c.informe_final=informeHTML(c,calcular(c),true);
      SEL=activos()[0]?.id||null;dirty();renderCase();refresh();msg(`Alta registrada. ${c.jugador} pasa al historial y al seguimiento post-alta de ${DIAS_SEGUIMIENTO} días.`);break}
    case 'btnDel':{const c=caso(SEL);if(!confirm(`¿Eliminar el tratamiento de ${c.jugador}? No queda en el historial.`))return;
      RTP.casos=RTP.casos.filter(x=>x.id!==c.id);SEL=activos()[0]?.id||null;dirty();renderCase();refresh();break}
  }
});
function imprimir(cls){document.body.classList.add(cls);
  setTimeout(()=>{const t=Date.now();try{window.print()}catch(e){}
    document.body.classList.remove(cls);
    if(Date.now()-t<150)msg('Este visor no permite imprimir. En el tablero publicado (GitHub Pages) el botón abre la ventana de impresión normal.','error');},60)}
window.addEventListener('beforeunload',e=>{if(DIRTY&&!DEMO){e.preventDefault();e.returnValue=''}});

/* ================= Carga y guardado ================= */
function getToken(){let t=null;try{t=localStorage.getItem('gh_token')}catch(e){}
  if(!t){t=prompt('Pegá el token de GitHub para guardar (queda solo en este navegador):');if(t){t=t.trim();try{localStorage.setItem('gh_token',t)}catch(e){}}}
  return t}
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function leerRTPapi(token){
  const r=await fetch(RTP_API+'?ref=main',{headers:{Authorization:'token '+token,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404){SHA=null;return {version:1,casos:[]}}
  if(r.status===401){try{localStorage.removeItem('gh_token')}catch(e){}throw new Error('Token inválido')}
  if(!r.ok)throw new Error('No pude leer rtp.json ('+r.status+')');
  const j=await r.json();SHA=j.sha;return JSON.parse(b64d(j.content));
}
async function guardar(auto){
  if(DEMO){try{localStorage.setItem(DEMO_KEY,JSON.stringify(RTP))}catch(e){}
    if(!auto){DIRTY=false;$('#btnSave').disabled=true;msg('Guardado en este navegador (modo demo).')}return}
  const token=getToken();if(!token){msg('Falta el token de GitHub.','error');return}
  try{
    if(SHA===null){try{await leerRTPapi(token)}catch(e){}}
    const body={message:'RTP: actualizo casos',content:b64e(JSON.stringify(RTP,null,2)+'\n'),branch:'main'};if(SHA)body.sha=SHA;
    const r=await fetch(RTP_API,{method:'PUT',headers:{Authorization:'token '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){msg('Alguien más guardó primero. Recargá la página para no pisarle los cambios.','error');return}
    if(r.status===401){try{localStorage.removeItem('gh_token')}catch(e){}msg('Token inválido: se borró, volvé a guardar para ingresarlo.','error');return}
    if(!r.ok){msg('Error al guardar ('+r.status+').','error');return}
    SHA=(await r.json()).content.sha;DIRTY=false;$('#btnSave').disabled=true;msg('Cambios guardados en el repo.');
  }catch(e){msg('Error al guardar: '+e.message,'error')}
}
async function cargar(){
  try{
    // todo en paralelo: carga, VALD, objetivos del PF, casos y baterías
    let t=null;try{t=localStorage.getItem('gh_token')}catch(e){}
    const js=u=>fetch(u).then(x=>x.ok?x.json():null).catch(()=>null);
    const RAW=`https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/`,v='?v='+Date.now();
    const [c,d,p,rt,bt]=await Promise.all([js('../carga.json'+v),js('../data.json'+v),js('../plan.json'+v),
      t?leerRTPapi(t).catch(()=>js(RAW+'rtp.json'+v)):js(RAW+'rtp.json'+v),js(RAW+'rtp_baterias.json'+v)]);
    if(!c)throw 0;
    CARGA=c;DATA=d;PLAN=p;RTP=rt||{version:1,casos:[]};
    if(bt){BATERIAS={...(bt.baterias||{}),otra:{t:'Sin batería',tests:[]}};if(bt.lesiones)LESIONES={...LESIONES,...bt.lesiones}}
    RTP.casos=RTP.casos||[];
  }catch(e){
    msg('No pude leer los datos del tablero (carga.json). Tocá "Actualizar datos" en Carga externa y volvé a abrir esta página.','error');
    return;
  }
  SEL=activos()[0]?.id||null;showView('case');renderCase();refresh();
}
cargar();
